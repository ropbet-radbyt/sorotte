name: syncplay-gui release

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - "**"
    tags:
      - "v*"

permissions:
  contents: write

env:
  SYNCPLAY_GUI_PUBLIC_RELEASE_REPO: ropbet-radbyt/syncplay-rs-downloads
  SYNCPLAY_GUI_DEV_RELEASE_TAG: syncplay-gui-dev

jobs:
  gui-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Check formatting
        shell: pwsh
        run: cargo fmt --all --check

      - name: Run GUI updater tests
        shell: pwsh
        run: cargo test -p syncplay-gui update_

      - name: Build GUI release binaries
        shell: pwsh
        run: |
          cargo build --release -p syncplay-gui --bin syncplay-gui
          cargo build --release -p syncplay-gui --bin syncplay-gui-updater

      - name: Package GUI release
        shell: pwsh
        run: |
          $channel = if ($env:GITHUB_REF -like "refs/tags/v*") { "stable" } else { "dev" }
          ./scripts/package-gui-release.ps1 -Channel $channel -SkipBuild

      - name: Upload GUI package artifact
        uses: actions/upload-artifact@v4
        with:
          name: syncplay-gui-windows-x86_64
          path: target/gui-release/artifacts/*

      - name: Attach package to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
              gh release create $tag --title $tag --notes "Syncplay GUI release $tag"
              if ($LASTEXITCODE -ne 0) {
                  throw "gh release create failed with exit code $LASTEXITCODE"
              }
          }
          gh release upload $tag target/gui-release/artifacts/* --clobber
          if ($LASTEXITCODE -ne 0) {
              throw "gh release upload failed with exit code $LASTEXITCODE"
          }

      - name: Publish package to public downloads repo
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.SYNCPLAY_DOWNLOADS_TOKEN }}
        run: |
          if (-not $env:GH_TOKEN) {
              Write-Warning "SYNCPLAY_DOWNLOADS_TOKEN is not configured; skipping public GUI package publishing."
              exit 0
          }

          if ($env:GITHUB_REF -like "refs/tags/v*") {
              $tag = $env:GITHUB_REF_NAME
              $title = $tag
              $notes = "Syncplay GUI release $tag"
              $isPrerelease = $false
          } else {
              $tag = $env:SYNCPLAY_GUI_DEV_RELEASE_TAG
              $shortSha = $env:GITHUB_SHA.Substring(0, 7)
              $title = "Syncplay GUI dev build"
              $notes = "Latest dev build from $env:GITHUB_REF_NAME ($shortSha)."
              $isPrerelease = $true
          }

          gh release view $tag --repo $env:SYNCPLAY_GUI_PUBLIC_RELEASE_REPO *> $null
          if ($LASTEXITCODE -ne 0) {
              $createArgs = @(
                  "release", "create", $tag,
                  "--repo", $env:SYNCPLAY_GUI_PUBLIC_RELEASE_REPO,
                  "--title", $title,
                  "--notes", $notes
              )
              if ($isPrerelease) {
                  $createArgs += "--prerelease"
              }
              gh @createArgs
              if ($LASTEXITCODE -ne 0) {
                  throw "gh release create failed with exit code $LASTEXITCODE"
              }
          } elseif ($isPrerelease) {
              gh release edit $tag --repo $env:SYNCPLAY_GUI_PUBLIC_RELEASE_REPO --title $title --notes $notes --prerelease
              if ($LASTEXITCODE -ne 0) {
                  throw "gh release edit failed with exit code $LASTEXITCODE"
              }
          }

          gh release upload $tag target/gui-release/artifacts/* --repo $env:SYNCPLAY_GUI_PUBLIC_RELEASE_REPO --clobber
          if ($LASTEXITCODE -ne 0) {
              throw "gh release upload failed with exit code $LASTEXITCODE"
          }
