name: sorotte Protocol Fuzz

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "coverage/behaviors.toml"
      - "coverage/known-defects.toml"
      - "crates/sorotte-protocol/**"
      - "fuzz/**"
      - ".github/workflows/rust-fuzz.yml"
      - "scripts/known_defect_policy.py"
      - "scripts/tests/test_known_defect_policy.py"
      - "scripts/tests/test_protocol_fuzz_policy.py"
  push:
    branches:
      - main
    paths:
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "coverage/behaviors.toml"
      - "coverage/known-defects.toml"
      - "crates/sorotte-protocol/**"
      - "fuzz/**"
      - ".github/workflows/rust-fuzz.yml"
      - "scripts/known_defect_policy.py"
      - "scripts/tests/test_known_defect_policy.py"
      - "scripts/tests/test_protocol_fuzz_policy.py"
  workflow_dispatch:
  schedule:
    - cron: "45 3 * * 3"

permissions:
  contents: read

concurrency:
  group: sorotte-protocol-fuzz-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}

jobs:
  protocol-fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FUZZ_SECONDS: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && '45' || '900' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup pinned nightly Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable resolved 2026-07-28
        with:
          toolchain: nightly-2026-07-29
          components: rust-src

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install CI policy prerequisites
        run: python -m pip install --disable-pip-version-check -r requirements/ci-policy.txt

      - name: Install pinned cargo-fuzz
        uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: cargo-fuzz@0.13.2
          fallback: none

      - name: Verify exact fuzz toolchain
        run: |
          test "$(cargo fuzz --version)" = "cargo-fuzz 0.13.2"
          rustc +nightly-2026-07-29 -vV

      - name: Validate protocol fuzz policy
        run: python -m unittest scripts.tests.test_protocol_fuzz_policy -v

      - name: Build protocol fuzz target
        run: >-
          cargo +nightly-2026-07-29 fuzz build
          --fuzz-dir fuzz
          --sanitizer address
          protocol_line

      - name: Run bounded protocol fuzz target
        run: >-
          python fuzz/run_protocol_fuzz.py
          --toolchain nightly-2026-07-29
          --source-sha "${{ github.sha }}"
          --seconds "${FUZZ_SECONDS}"
          --seed-corpus crates/sorotte-protocol/tests/corpus/protocol_parser
          --expected-seed-count 14
          --output-root target/fuzz-ci/protocol-line

      - name: Upload protocol fuzz evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sorotte-protocol-fuzz
          path: target/fuzz-ci/protocol-line
          if-no-files-found: error
          retention-days: 14
          overwrite: true
