name: sorotte Protocol Fuzz

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "45 3 * * 3"

permissions:
  contents: read

concurrency:
  group: sorotte-protocol-fuzz-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}

env:
  VERIFICATION_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  selection:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      selected: ${{ steps.select.outputs.selected }}
    steps:
      - name: Checkout exact candidate
        id: ci_checkout_exact_candidate_5433e8e2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.VERIFICATION_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Python
        id: ci_setup_python_37490e7b
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Validate selection prerequisites
        id: ci_validate_selection_prerequisites_1f3be78a
        run: python scripts/verify.py preflight --phase static --output target/verification/preflight.json
      - name: Compute source-bound obligations
        id: ci_compute_source_bound_obligations_e1d79ba7
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: python scripts/verify.py plan --base "$BASE_SHA" --head "$VERIFICATION_SHA" --output target/verification/plan.json
      - name: Select applicable producer
        id: select
        env:
          FORCE: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '--force' || '' }}
        run: python scripts/verify.py selected --plan target/verification/plan.json --lane fuzz $FORCE --github-output "$GITHUB_OUTPUT"
      - name: Preserve immutable plan
        id: ci_preserve_immutable_plan_ae04ffdd
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/verification/plan.json
          if-no-files-found: error
          retention-days: 90

  protocol-fuzz:
    needs: selection
    if: needs.selection.outputs.selected == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      FUZZ_SECONDS: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && '45' || '900' }}
    steps:
      - name: Checkout
        id: ci_checkout_be2fc371
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.VERIFICATION_SHA }}
          persist-credentials: false

      - name: Setup pinned nightly Rust
        id: ci_setup_pinned_nightly_rust_a2f02be5
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable resolved 2026-07-28
        with:
          toolchain: nightly-2026-07-29
          components: rust-src

      - name: Setup Python
        id: ci_setup_python_c04ca57c
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install CI policy prerequisites
        id: ci_install_ci_policy_prerequisites_4342181d
        run: python -m pip install --disable-pip-version-check -r requirements/ci-policy.txt

      - name: Install pinned cargo-fuzz
        id: ci_install_pinned_cargo_fuzz_e3416ca0
        run: >-
          cargo +nightly-2026-07-29 install cargo-fuzz
          --version 0.13.2
          --locked

      - name: Verify exact fuzz toolchain
        id: ci_verify_exact_fuzz_toolchain_81ea4c0b
        run: |
          test "$(cargo fuzz --version)" = "cargo-fuzz 0.13.2"
          rustc +nightly-2026-07-29 -vV

      - name: Validate protocol fuzz policy
        id: ci_validate_protocol_fuzz_policy_f620a684
        run: python -m unittest scripts.tests.test_protocol_fuzz_policy -v

      - name: Exercise real pinned build run minimize and report contracts
        id: ci_exercise_real_pinned_build_run_minimiz_802bfb21
        run: python scripts/fuzz_tool_canary.py --output target/fuzz-tool-canary

      - name: Install deterministic regression runner
        id: ci_install_deterministic_regression_runne_33ef97e6
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2.85.7
        with:
          tool: cargo-nextest@0.9.137
          fallback: none

      - name: Replay retained product fuzz regressions
        id: ci_replay_retained_product_fuzz_regressio_4186de5c
        run: python scripts/fuzz_regressions.py replay --output target/fuzz-regressions.json

      - name: Preserve real fuzz tooling and regression evidence
        id: ci_preserve_real_fuzz_tooling_and_regress_4753cd80
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-tool-canary-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/fuzz-tool-canary
            target/fuzz-regressions.json
          if-no-files-found: error
          retention-days: 90

      - name: Build protocol fuzz target
        id: ci_build_protocol_fuzz_target_8e536549
        run: >-
          cargo +nightly-2026-07-29 fuzz build
          --fuzz-dir fuzz
          --sanitizer address
          protocol_line

      - name: Run bounded protocol fuzz target
        id: ci_run_bounded_protocol_fuzz_target_d27893e1
        run: >-
          python fuzz/run_protocol_fuzz.py
          --toolchain nightly-2026-07-29
          --source-sha "${{ env.VERIFICATION_SHA }}"
          --seconds "${FUZZ_SECONDS}"
          --seed-corpus crates/sorotte-protocol/tests/corpus/protocol_parser
          --corpus-manifest coverage/fuzz-corpora.json
          --output-root target/fuzz-ci/protocol-line

      - name: Upload protocol fuzz evidence
        id: ci_upload_protocol_fuzz_evidence_194683a2
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sorotte-protocol-fuzz-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/fuzz-ci/protocol-line
          if-no-files-found: error
          retention-days: 14

  framed-session-fuzz:
    needs: selection
    if: needs.selection.outputs.selected == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      FUZZ_SECONDS: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && '45' || '900' }}
    steps:
      - name: Checkout
        id: ci_checkout_1c917ecd
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.VERIFICATION_SHA }}
          persist-credentials: false

      - name: Setup pinned nightly Rust
        id: ci_setup_pinned_nightly_rust_821f6d09
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable resolved 2026-07-28
        with:
          toolchain: nightly-2026-07-29
          components: rust-src

      - name: Setup Python
        id: ci_setup_python_2eba7f68
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install CI policy prerequisites
        id: ci_install_ci_policy_prerequisites_81304427
        run: python -m pip install --disable-pip-version-check -r requirements/ci-policy.txt

      - name: Install pinned cargo-fuzz
        id: ci_install_pinned_cargo_fuzz_4ebf80ea
        run: >-
          cargo +nightly-2026-07-29 install cargo-fuzz
          --version 0.13.2
          --locked

      - name: Verify exact fuzz toolchain
        id: ci_verify_exact_fuzz_toolchain_11603e2f
        run: |
          test "$(cargo fuzz --version)" = "cargo-fuzz 0.13.2"
          rustc +nightly-2026-07-29 -vV

      - name: Validate protocol fuzz policy
        id: ci_validate_protocol_fuzz_policy_7f06d3f9
        run: python -m unittest scripts.tests.test_protocol_fuzz_policy -v

      - name: Build framed-session fuzz target
        id: ci_build_framed_session_fuzz_target_45a8c6e5
        run: >-
          cargo +nightly-2026-07-29 fuzz build
          --fuzz-dir fuzz
          --sanitizer address
          framed_session

      - name: Run bounded framed-session fuzz target
        id: ci_run_bounded_framed_session_fuzz_target_880bf5b5
        run: >-
          python fuzz/run_protocol_fuzz.py
          --target framed_session
          --toolchain nightly-2026-07-29
          --source-sha "${{ env.VERIFICATION_SHA }}"
          --seconds "${FUZZ_SECONDS}"
          --seed-corpus crates/sorotte-cli/tests/corpus/framed_session
          --corpus-manifest coverage/fuzz-corpora.json
          --output-root target/fuzz-ci/framed-session

      - name: Upload framed-session fuzz evidence
        id: ci_upload_framed_session_fuzz_evidence_05534c83
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sorotte-framed-session-fuzz-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/fuzz-ci/framed-session
          if-no-files-found: error
          retention-days: 14

  mpv-framed-transcript-fuzz:
    needs: selection
    if: needs.selection.outputs.selected == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      FUZZ_SECONDS: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && '45' || '900' }}
    steps:
      - name: Checkout
        id: ci_checkout_710c567c
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.VERIFICATION_SHA }}
          persist-credentials: false

      - name: Setup pinned nightly Rust
        id: ci_setup_pinned_nightly_rust_da171eb8
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable resolved 2026-07-28
        with:
          toolchain: nightly-2026-07-29
          components: rust-src

      - name: Setup Python
        id: ci_setup_python_9efd75f7
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install CI policy prerequisites
        id: ci_install_ci_policy_prerequisites_8c472717
        run: python -m pip install --disable-pip-version-check -r requirements/ci-policy.txt

      - name: Install pinned cargo-fuzz
        id: ci_install_pinned_cargo_fuzz_0f4839e1
        run: >-
          cargo +nightly-2026-07-29 install cargo-fuzz
          --version 0.13.2
          --locked

      - name: Verify exact fuzz toolchain
        id: ci_verify_exact_fuzz_toolchain_4748da5a
        run: |
          test "$(cargo fuzz --version)" = "cargo-fuzz 0.13.2"
          rustc +nightly-2026-07-29 -vV

      - name: Validate protocol fuzz policy
        id: ci_validate_protocol_fuzz_policy_53c4d32b
        run: python -m unittest scripts.tests.test_protocol_fuzz_policy -v

      - name: Build mpv framed-transcript fuzz target
        id: ci_build_mpv_framed_transcript_fuzz_targe_f1f69578
        run: >-
          cargo +nightly-2026-07-29 fuzz build
          --fuzz-dir fuzz
          --sanitizer address
          mpv_framed_transcript

      - name: Run bounded mpv framed-transcript fuzz target
        id: ci_run_bounded_mpv_framed_transcript_fuzz_5cb2dd38
        run: >-
          python fuzz/run_protocol_fuzz.py
          --target mpv_framed_transcript
          --toolchain nightly-2026-07-29
          --source-sha "${{ env.VERIFICATION_SHA }}"
          --seconds "${FUZZ_SECONDS}"
          --seed-corpus crates/sorotte-player-mpv/tests/corpus/framed_ipc_transcript
          --corpus-manifest coverage/fuzz-corpora.json
          --output-root target/fuzz-ci/mpv-framed-transcript

      - name: Upload mpv framed-transcript fuzz evidence
        id: ci_upload_mpv_framed_transcript_fuzz_evid_edd85772
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sorotte-mpv-framed-transcript-fuzz-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/fuzz-ci/mpv-framed-transcript
          if-no-files-found: error
          retention-days: 14

  fuzz-required:
    name: fuzz-required
    if: always()
    needs: [selection, protocol-fuzz, framed-session-fuzz, mpv-framed-transcript-fuzz]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate
        id: ci_checkout_exact_candidate_e0c2ead6
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.VERIFICATION_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Python
        id: ci_setup_python_40fde241
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Require selection authority
        id: ci_require_selection_authority_4713a1bf
        env:
          SELECTION_RESULT: ${{ needs.selection.result }}
        run: test "$SELECTION_RESULT" = success
      - name: Retrieve immutable plan
        id: ci_retrieve_immutable_plan_2076b323
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fuzz-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/verification
      - name: Validate every applicable producer or explicit no-op
        id: ci_validate_every_applicable_producer_or__79928092
        env:
          SELECTED: ${{ needs.selection.outputs.selected }}
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
          RESULT_0: ${{ needs['protocol-fuzz'].result }}
          RESULT_1: ${{ needs['framed-session-fuzz'].result }}
          RESULT_2: ${{ needs['mpv-framed-transcript-fuzz'].result }}
        run: >-
          python scripts/verify.py gate --lane fuzz --selected "$SELECTED"
          --plan target/verification/plan.json
          --base-sha "$EXPECTED_BASE" --source-sha "$VERIFICATION_SHA"
          --expected-job protocol-fuzz --job-result "protocol-fuzz=$RESULT_0"
          --expected-job framed-session-fuzz --job-result "framed-session-fuzz=$RESULT_1"
          --expected-job mpv-framed-transcript-fuzz --job-result "mpv-framed-transcript-fuzz=$RESULT_2"
          --output target/verification/fuzz-required.json
      - name: Preserve required receipt
        id: ci_preserve_required_receipt_2006f306
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-required-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/verification/fuzz-required.json
          if-no-files-found: error
          retention-days: 90
