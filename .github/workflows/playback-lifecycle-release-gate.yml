name: playback lifecycle release gate

on:
  workflow_call:
    inputs:
      candidate_sha:
        description: Full Sorotte commit SHA whose release candidates must be verified
        required: true
        type: string
      channel:
        description: Ref-derived release channel is part of the immutable build input
        required: false
        default: stable
        type: string

permissions:
  contents: read

jobs:
  linux-candidate:
    name: Linux immutable candidate lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      MPV_SOURCE_SHA: 41f6a645068483470267271e1d09966ca3b9f413
      MPV_MINIMUM_VERSION: "0.41.0"
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      CANDIDATE_DIR: target/playback-release-candidate/linux-x86_64
      EVIDENCE_DIR: target/verification/playback-release-evidence/linux-x86_64
    steps:
      - name: Checkout exact Sorotte candidate
        id: ci_checkout_exact_sorotte_candidate_5de84255
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false

      - name: Bind Linux checkout to release candidate
        id: ci_bind_linux_checkout_to_release_candida_5097b406
        run: |
          test "$CANDIDATE_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse 'HEAD^{commit}')" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Setup Rust
        id: ci_setup_rust_64dd10de
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable resolved 2026-09-08
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Setup Python
        id: ci_setup_python_d5b06dd2
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install supported mpv build dependencies
        id: ci_install_supported_mpv_build_dependenci_bab10807
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            ffmpeg \
            libass-dev \
            libavcodec-dev \
            libavfilter-dev \
            libavformat-dev \
            libavutil-dev \
            liblua5.2-dev \
            libplacebo-dev \
            libswresample-dev \
            libswscale-dev \
            meson \
            ninja-build \
            pkg-config

      - name: Checkout pinned official mpv source
        id: ci_checkout_pinned_official_mpv_source_b432a13d
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mpv-player/mpv
          ref: ${{ env.MPV_SOURCE_SHA }}
          path: target/mpv-supported-release
          persist-credentials: false

      - name: Verify supported mpv source revision
        id: ci_verify_supported_mpv_source_revision_bd0cb841
        working-directory: target/mpv-supported-release
        run: test "$(git rev-parse 'HEAD^{commit}')" = "$MPV_SOURCE_SHA"

      - name: Build pinned supported mpv
        id: ci_build_pinned_supported_mpv_6f06eec3
        working-directory: target/mpv-supported-release
        run: |
          meson setup build \
            -Dalsa=disabled \
            -Dbuild-date=false \
            -Ddrm=disabled \
            -Dgl=disabled \
            -Dlibmpv=false \
            -Dlua=enabled \
            -Dmanpage-build=disabled \
            -Dpipewire=disabled \
            -Dpulse=disabled \
            -Dtests=false \
            -Dvaapi=disabled \
            -Dvulkan=disabled \
            -Dwayland=disabled \
            -Dx11=disabled
          meson compile -C build ./mpv:executable

      - name: Verify supported mpv version
        id: ci_verify_supported_mpv_version_cf083c4c
        run: >-
          python scripts/mpv_version_matrix.py validate
          --identity minimum
          --source-sha "$MPV_SOURCE_SHA"
          --minimum-source-sha "$MPV_SOURCE_SHA"
          --newest-source-sha d12f2ce19c918875981e00ed276f153bdf40a2ac
          --minimum-version "$MPV_MINIMUM_VERSION"
          --binary target/mpv-supported-release/build/mpv

      - name: Validate closed lifecycle declarations and deterministic model
        id: ci_validate_closed_lifecycle_declarations_742a9d08
        run: |
          python scripts/behavior_evidence.py validate --catalog coverage/behaviors.toml
          python scripts/playback_lifecycle_model.py validate --model coverage/playback-lifecycle.toml --require-closed
          python scripts/playback_lifecycle_oracle.py witness-summary --model coverage/playback-lifecycle.toml --compact
          python scripts/playback_lifecycle_oracle.py run-suite --schedule-dir fixtures/playback-lifecycle
          python -m unittest \
            scripts.tests.test_playback_lifecycle_evidence \
            scripts.tests.test_playback_lifecycle_faults \
            scripts.tests.test_playback_start_gate_system \
            scripts.tests.test_playback_release_gate

      - name: Capture Linux release build inputs
        id: ci_capture_linux_release_build_inputs_ea2ab61b
        run: |
          python scripts/release_qualification.py inputs \
            --candidate-sha "$CANDIDATE_SHA" --platform linux-x86_64 --channel "${{ inputs.channel }}" \
            --tool mpv=target/mpv-supported-release/build/mpv --tool ffmpeg=ffmpeg \
            --output target/playback-release-build-inputs.json

      - name: Build exact Linux release candidates
        id: ci_build_exact_linux_release_candidates_caa5099b
        run: cargo build --locked --release -p sorotte-server -p sorotte-cli

      - name: Seal immutable Linux candidate bundle
        id: ci_seal_immutable_linux_candidate_bundle_07234417
        run: |
          python scripts/playback_release_gate.py bundle \
            --candidate-sha "$CANDIDATE_SHA" \
            --platform linux-x86_64 \
            --channel "${{ inputs.channel }}" \
            --input-manifest target/playback-release-build-inputs.json \
            --artifact server=target/release/sorotte-server \
            --artifact client=target/release/sorotte-cli \
            --output-dir "$CANDIDATE_DIR"

      - name: Upload immutable Linux release bundle
        id: ci_upload_immutable_linux_release_bundle_6b60403e
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bundle-linux-x86_64-${{ inputs.candidate_sha }}
          path: ${{ env.CANDIDATE_DIR }}
          if-no-files-found: error
          retention-days: 90
          overwrite: true

      - name: Upload Linux approved build input record
        id: ci_upload_linux_approved_build_input_reco_c92cdacd
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-input-record-linux-x86_64-${{ inputs.candidate_sha }}
          path: ${{ env.CANDIDATE_DIR }}/candidate-manifest.json
          if-no-files-found: error
          retention-days: 90
          overwrite: true

      - name: Run ordinary and terminal exact-candidate lifecycle
        id: playback_lifecycle_system
        continue-on-error: true
        run: |
          python scripts/playback_lifecycle_system.py run \
            --server target/release/sorotte-server \
            --client target/release/sorotte-cli \
            --mpv target/mpv-supported-release/build/mpv \
            --ffmpeg ffmpeg \
            --artifact-dir target/verification/playback-lifecycle-release \
            --candidate-sha "$CANDIDATE_SHA"

      - name: Run loop-boundary exact-candidate lifecycle
        id: ci_run_loop_boundary_exact_candidate_life_5c57c55a
        run: |
          python scripts/playback_lifecycle_system.py run \
            --server target/release/sorotte-server \
            --client target/release/sorotte-cli \
            --mpv target/mpv-supported-release/build/mpv \
            --ffmpeg ffmpeg \
            --artifact-dir target/verification/playback-lifecycle-loop-release \
            --candidate-sha "$CANDIDATE_SHA" \
            --loop-at-end-of-playlist

      - name: Run generated every-phase start-gate lifecycle
        id: ci_run_generated_every_phase_start_gate_l_e717b2ff
        run: |
          python scripts/playback_start_gate_system.py \
            --server target/release/sorotte-server \
            --artifact-dir target/verification/playback-start-gate-release \
            --candidate-sha "$CANDIDATE_SHA"

      - name: Validate and stage privacy-safe release evidence
        id: playback_lifecycle_evidence
        if: always()
        continue-on-error: true
        run: |
          python scripts/playback_lifecycle_system.py stage-safe-evidence \
            --artifact-dir target/verification/playback-lifecycle-release \
            --output-dir target/verification/playback-lifecycle-release-safe

      - name: Require every declared lifecycle gap to be closed
        id: playback_lifecycle_closed
        if: always()
        continue-on-error: true
        run: >-
          python scripts/playback_lifecycle_model.py validate
          --model coverage/playback-lifecycle.toml
          --require-closed

      - name: Upload privacy-safe lifecycle release evidence
        id: ci_upload_privacy_safe_lifecycle_release__ed6cebb6
        if: ${{ always() && steps.playback_lifecycle_evidence.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playback-lifecycle-release-${{ inputs.candidate_sha }}
          path: target/verification/playback-lifecycle-release-safe
          if-no-files-found: error
          retention-days: 30
          overwrite: true

      - name: Enforce exact-candidate lifecycle release gate
        id: ci_enforce_exact_candidate_lifecycle_rele_c57902a6
        if: always()
        env:
          PLAYBACK_LIFECYCLE_SYSTEM_OUTCOME: ${{ steps.playback_lifecycle_system.outcome }}
          PLAYBACK_LIFECYCLE_EVIDENCE_OUTCOME: ${{ steps.playback_lifecycle_evidence.outcome }}
          PLAYBACK_LIFECYCLE_CLOSED_OUTCOME: ${{ steps.playback_lifecycle_closed.outcome }}
        run: |
          test "$PLAYBACK_LIFECYCLE_SYSTEM_OUTCOME" = success
          test "$PLAYBACK_LIFECYCLE_EVIDENCE_OUTCOME" = success
          test "$PLAYBACK_LIFECYCLE_CLOSED_OUTCOME" = success

      - name: Attest exact Linux suite and candidate digests
        id: ci_attest_exact_linux_suite_and_candidate_2f7e3039
        run: |
          python scripts/playback_release_gate.py attest-linux \
            --bundle-dir "$CANDIDATE_DIR" \
            --candidate-sha "$CANDIDATE_SHA" \
            --system-report target/verification/playback-lifecycle-release/report.json \
            --loop-report target/verification/playback-lifecycle-loop-release/report.json \
            --start-report target/verification/playback-start-gate-release/playback-start-gate-system-report.json \
            --model coverage/playback-lifecycle.toml \
            --output target/verification/playback-lifecycle-release-safe/platform-gate.json

      - name: Upload Linux platform lifecycle attestation
        id: ci_upload_linux_platform_lifecycle_attest_184b37f1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playback-lifecycle-platform-linux-${{ inputs.candidate_sha }}
          path: target/verification/playback-lifecycle-release-safe/platform-gate.json
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  windows-candidate:
    name: Windows exact GUI and status candidate lifecycle
    runs-on:
      - self-hosted
      - Windows
      - X64
      - sorotte-native-interactive
      - sorotte-ephemeral
    timeout-minutes: 70
    env:
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      CANDIDATE_DIR: target/playback-release-candidate/windows-x86_64
    steps:
      - name: Attest ephemeral interactive Windows runner
        id: ci_attest_ephemeral_interactive_windows_r_026d4f00
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          if ($env:SOROTTE_NATIVE_RUNNER_CONTRACT -cne "sorotte-ephemeral-interactive-windows-v1") {
              throw "interactive runner contract is missing or unsupported"
          }
          if ($env:SOROTTE_NATIVE_RUNNER_MAX_JOBS -cne "1") {
              throw "interactive runner must attest a one-job lifetime"
          }
          $instance = [Guid]::Empty
          if (-not [Guid]::TryParse($env:SOROTTE_NATIVE_RUNNER_INSTANCE_ID, [ref]$instance) -or $instance -eq [Guid]::Empty) {
              throw "interactive runner instance ID is invalid"
          }
          $sessionId = [System.Diagnostics.Process]::GetCurrentProcess().SessionId
          if ($sessionId -le 0) {
              throw "interactive runner cannot execute in session zero"
          }
          $explorer = @(Get-Process -Name explorer -ErrorAction SilentlyContinue | Where-Object { $_.SessionId -eq $sessionId })
          if ($explorer.Count -eq 0) {
              throw "interactive runner session has no Explorer shell"
          }

      - name: Checkout exact Sorotte candidate
        id: ci_checkout_exact_sorotte_candidate_3713d2e1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          clean: true
          persist-credentials: false

      - name: Bind Windows checkout to release candidate
        id: ci_bind_windows_checkout_to_release_candi_b30ab641
        shell: pwsh
        run: |
          $actual = (git rev-parse 'HEAD^{commit}').Trim()
          if ($actual -cne $env:CANDIDATE_SHA -or $env:GITHUB_SHA -cne $env:CANDIDATE_SHA) {
              throw "Windows checkout differs from exact release candidate"
          }
          if (@(git status --porcelain --untracked-files=all).Count -ne 0) {
              throw "Windows release candidate checkout is not clean"
          }

      - name: Setup Rust
        id: ci_setup_rust_19d5cf83
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable resolved 2026-09-08
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Setup Python
        id: ci_setup_python_c1c69d60
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Qualify the exact Windows release playback candidate
        id: playback
        uses: ./.github/actions/windows-playback-qualification
        with:
          candidate_sha: ${{ inputs.candidate_sha }}
          channel: ${{ inputs.channel }}

      - name: Project Windows diagnostics before ephemeral teardown
        id: ci_project_windows_diagnostics_before_eph_39673358
        if: always()
        shell: pwsh
        env:
          SAFE_NATIVE_DIR: ${{ runner.temp }}/native-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          VERTICAL_OUTCOME: ${{ steps.playback.outputs.vertical }}
          STATUS_OUTCOME: ${{ steps.playback.outputs.status }}
          ATTESTATION_OUTCOME: ${{ steps.playback.outputs.attestation }}
          RECOVERY_OUTCOME: ${{ steps.playback.outputs.recovery }}
          HTTP_FAULT_OUTCOME: ${{ steps.playback.outputs.http_fault }}
          HTTP_STALL_OUTCOME: ${{ steps.playback.outputs.http_stall }}
        run: |
          $exported = $false
          if ((Test-Path scripts/native_failure_evidence.py) -and (Get-Command python -ErrorAction SilentlyContinue)) {
            python scripts/native_failure_evidence.py export --root target/verification --output $env:SAFE_NATIVE_DIR --source-sha $env:CANDIDATE_SHA --run-id $env:GITHUB_RUN_ID --run-attempt $env:GITHUB_RUN_ATTEMPT --stage windows-lifecycle --cleanup unavailable --mode-outcome "vertical=$env:VERTICAL_OUTCOME" --mode-outcome "status=$env:STATUS_OUTCOME" --mode-outcome "attestation=$env:ATTESTATION_OUTCOME" --mode-outcome "recovery=$env:RECOVERY_OUTCOME" --mode-outcome "http-fault=$env:HTTP_FAULT_OUTCOME" --mode-outcome "http-stall=$env:HTTP_STALL_OUTCOME"
            $exported = $LASTEXITCODE -eq 0
          }
          if (-not $exported) {
            $null = New-Item -ItemType Directory -Force -Path $env:SAFE_NATIVE_DIR
            @{ schema_version=1; kind="sorotte-native-diagnostic"; authoritative=$false; source_sha=$env:CANDIDATE_SHA; run_id=$env:GITHUB_RUN_ID; run_attempt=$env:GITHUB_RUN_ATTEMPT; stage="windows-lifecycle"; cleanup="unavailable"; records=@(@{status="unavailable";reason="exporter-unavailable-before-checkout-or-setup"}) } | ConvertTo-Json -Depth 5 | Set-Content (Join-Path $env:SAFE_NATIVE_DIR diagnostic.json)
          }

      - name: Retain safe Windows failure evidence
        id: ci_retain_safe_windows_failure_evidence_5d4b3f3b
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-diagnostic-${{ inputs.candidate_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 90

  complete-candidate:
    name: Complete cross-platform lifecycle attestation
    needs:
      - linux-candidate
      - windows-candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
    steps:
      - name: Checkout exact Sorotte candidate
        id: ci_checkout_exact_sorotte_candidate_1fa2d704
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false

      - name: Setup Python
        id: ci_setup_python_58324f54
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Download Linux platform lifecycle attestation
        id: ci_download_linux_platform_lifecycle_atte_990457b8
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: playback-lifecycle-platform-linux-${{ inputs.candidate_sha }}
          path: target/verification/complete-gate/linux

      - name: Download Windows platform lifecycle attestation
        id: ci_download_windows_platform_lifecycle_at_4fc9bb27
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: playback-lifecycle-platform-windows-${{ inputs.candidate_sha }}
          path: target/verification/complete-gate/windows

      - name: Prove complete model transition coverage
        id: ci_prove_complete_model_transition_covera_45aab257
        run: |
          test "$(git rev-parse 'HEAD^{commit}')" = "$CANDIDATE_SHA"
          python scripts/playback_lifecycle_model.py validate --model coverage/playback-lifecycle.toml --require-closed
          python scripts/playback_release_gate.py attest-complete \
            --candidate-sha "$CANDIDATE_SHA" \
            --linux-gate target/verification/complete-gate/linux/platform-gate.json \
            --windows-gate target/verification/complete-gate/windows/platform-gate.json \
            --model coverage/playback-lifecycle.toml \
            --output target/verification/complete-gate/platform-complete.json

      - name: Upload complete lifecycle attestation
        id: ci_upload_complete_lifecycle_attestation_38dd1580
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playback-lifecycle-complete-${{ inputs.candidate_sha }}
          path: target/verification/complete-gate/platform-complete.json
          if-no-files-found: error
          retention-days: 30
          overwrite: true

      - name: Download Linux approved build input record
        id: ci_download_linux_approved_build_input_re_d0dc7009
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-input-record-linux-x86_64-${{ inputs.candidate_sha }}
          path: target/verification/complete-gate/linux-inputs

      - name: Download Windows approved build input record
        id: ci_download_windows_approved_build_input__409c2559
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-input-record-windows-x86_64-${{ inputs.candidate_sha }}
          path: target/verification/complete-gate/windows-inputs

      - name: Retain compact source and build qualification record
        id: ci_retain_compact_source_and_build_qualif_0e237c9c
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-qualification-record-${{ inputs.candidate_sha }}
          path: target/verification/complete-gate
          if-no-files-found: error
          retention-days: 90
          overwrite: true
