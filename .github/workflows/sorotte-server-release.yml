name: sorotte-server release

on:
  workflow_dispatch:
  push:
    tags:
      - "server-v*"
      - "v*"

permissions:
  contents: read

jobs:
  server-release:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable resolved 2026-07-28
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install server release prerequisites
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/legacy-python-interop.txt

      - name: Strict server release verification
        shell: pwsh
        run: ./scripts/server-release-verify.ps1

      - name: Package server release
        shell: pwsh
        run: ./scripts/package-server-release.ps1

      - name: Verify packaged server release
        run: >-
          python scripts/verify_server_release_artifact.py
          --artifacts-dir target/server-release/artifacts
          --expected-source-sha "${{ github.sha }}"
          --report target/server-release/artifact-verification.json

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: server-release-report-${{ matrix.runner }}
          path: |
            target/server-release-verify/server-release-report.*
            target/server-release/artifact-verification.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload server package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sorotte-server-${{ matrix.runner }}
          path: target/server-release/artifacts/*
          if-no-files-found: error
