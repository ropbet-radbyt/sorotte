name: sorotte-server release

on:
  workflow_dispatch:
  push:
    tags:
      - "server-v*"
      - "v*"

jobs:
  server-release:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install server release prerequisites
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/legacy-python-interop.txt

      - name: Strict server release verification
        shell: pwsh
        run: ./scripts/server-release-verify.ps1

      - name: Package server release
        shell: pwsh
        run: ./scripts/package-server-release.ps1

      - name: Upload verification report
        uses: actions/upload-artifact@v4
        with:
          name: server-release-report-${{ matrix.runner }}
          path: target/server-release-verify/server-release-report.*

      - name: Upload server package
        uses: actions/upload-artifact@v4
        with:
          name: sorotte-server-${{ matrix.runner }}
          path: target/server-release/artifacts/*
