name: qualify container before merge

on:
  workflow_call:

permissions:
  contents: read
  actions: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/sorotte-server
  TEST_IMAGE: sorotte-server:test-${{ github.sha }}
  EVIDENCE_DIR: target/server-container-verification
  DOCKER_METADATA_SHORT_SHA_LENGTH: 40


jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact source
        id: ci_checkout_exact_source_c21f032e
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pinned Python
        id: ci_setup_pinned_python_97c5ab5c
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Setup pinned Docker Buildx
        id: ci_setup_pinned_docker_buildx_62fdb6c9
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Download shared qualified Linux product bundle
        id: ci_download_shared_qualified_linux_produc_173d6011
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle-linux-x86_64-${{ github.sha }}
          path: target/qualified-bundle

      - name: Download complete shared lifecycle qualification
        id: ci_download_complete_shared_lifecycle_qua_165f9d73
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: playback-lifecycle-complete-${{ github.sha }}
          path: target/qualified-receipt

      - name: Verify exact qualified lifecycle input closure
        id: ci_verify_exact_qualified_lifecycle_input_f6d32895
        run: >-
          python scripts/release_qualification.py consume --candidate-sha "${{ github.sha }}"
          --platform linux-x86_64 --channel stable --bundle-dir target/qualified-bundle
          --complete-receipt target/qualified-receipt/platform-complete.json

      - name: Capture immutable build metadata
        id: build_info
        shell: python
        run: |
          import datetime
          import os
          from pathlib import Path
          import subprocess
          import tomllib

          epoch = int(subprocess.check_output(
              ["git", "show", "-s", "--format=%ct", os.environ["GITHUB_SHA"]],
              text=True, timeout=30,
          ).strip())
          created = datetime.datetime.fromtimestamp(epoch, datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          version = tomllib.loads(Path('Cargo.toml').read_text(encoding='utf-8'))['workspace']['package']['version']
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8", newline="\n") as output:
              output.write(f"created={created}\n")
              output.write(f"version=v{version}\n")

      - name: Define publication tags and OCI labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=sha-${{ github.sha }}
            type=ref,event=tag
          labels: |
            org.opencontainers.image.title=sorotte server
            org.opencontainers.image.description=Sorotte Syncplay-compatible server
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.build_info.outputs.version }}
            org.opencontainers.image.created=${{ steps.build_info.outputs.created }}
            org.opencontainers.image.licenses=Apache-2.0

      - name: Record closed publication tag inventory
        id: ci_record_closed_publication_tag_inventor_3cc0c00e
        shell: bash
        env:
          PUBLISH_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          printf '%s\n' "$PUBLISH_TAGS" > "$EVIDENCE_DIR/tags.txt"

      - name: Build once and load the candidate image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.server
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.TEST_IMAGE }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_DATE=${{ steps.build_info.outputs.created }}
            VCS_REF=${{ github.sha }}
            SOURCE_REPOSITORY=https://github.com/${{ github.repository }}
          provenance: false
          sbom: false

      - name: Consume the loaded image through real server boundaries
        id: ci_consume_the_loaded_image_through_real__b835a461
        run: >-
          python scripts/verify_server_container.py smoke
          --image "${{ env.TEST_IMAGE }}"
          --expected-source-sha "${{ github.sha }}"
          --expected-source-url "https://github.com/${{ github.repository }}"
          --artifacts-dir "${{ env.EVIDENCE_DIR }}/runtime"
          --report "${{ env.EVIDENCE_DIR }}/runtime/runtime-report.json"

      - name: Generate SPDX SBOM from the tested local image
        id: ci_generate_spdx_sbom_from_the_tested_loc_49ffd6e4
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.TEST_IMAGE }}
          format: spdx-json
          output-file: ${{ env.EVIDENCE_DIR }}/sbom.spdx.json
          artifact-name: sorotte-server-${{ github.sha }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false
          syft-version: v1.51.1

      - name: Bind SBOM bytes to the tested local image ID
        id: ci_bind_sbom_bytes_to_the_tested_local_im_e9888757
        run: >-
          python scripts/verify_server_container.py verify-sbom
          --sbom "${{ env.EVIDENCE_DIR }}/sbom.spdx.json"
          --runtime-report "${{ env.EVIDENCE_DIR }}/runtime/runtime-report.json"
          --report "${{ env.EVIDENCE_DIR }}/sbom-report.json"

      - name: Seal the tested container image for promotion
        id: seal_image
        run: >-
          python scripts/container_candidate.py seal --source-sha "$GITHUB_SHA"
          --image "$TEST_IMAGE" --evidence-dir "$EVIDENCE_DIR"
          --output-dir target/qualified-container
      - name: Prove cold restoration before merging
        id: restore_image
        run: >-
          python scripts/container_candidate.py roundtrip --source-sha "$GITHUB_SHA"
          --image "$TEST_IMAGE" --evidence-dir "$EVIDENCE_DIR"
          --bundle-dir target/qualified-container --report "$EVIDENCE_DIR/restoration-report.json"
      - name: Retain the exact tested container image
        id: retain_image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualified-container-${{ github.sha }}
          path: target/qualified-container/*
          if-no-files-found: error
          retention-days: 90
      - name: Retain all container qualification evidence
        id: retain_evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-container-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 90
