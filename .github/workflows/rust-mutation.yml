name: sorotte Mutation Testing

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/rust-mutation.yml"
      - "coverage/mutation-policy.toml"
      - "coverage/mutation-report-set.json"
      - "scripts/mutation_ci.py"
      - "scripts/mutation_selection.py"
      - "scripts/artifact_input.py"
      - "coverage/mutation-selection.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - "crates/**"
      - "fixtures/**"
      - "crates/sorotte-protocol/src/lib.rs"
      - "crates/sorotte-protocol/src/state.rs"
      - "crates/sorotte-protocol/src/participant_status.rs"
      - "crates/sorotte-player-api/src/lib.rs"
      - "crates/sorotte-player-mpv/src/adapter.rs"
      - "crates/sorotte-player-mpv/src/adapter/reconnection.rs"
      - "crates/sorotte-player-mpv/src/adapter/state.rs"
      - "crates/sorotte-player-mpv/src/adapter/player_adapter.rs"
      - "crates/sorotte-client-core/src/**"
      - "crates/sorotte-client-app/src/**"
      - "crates/sorotte-cli/src/**"
      - "crates/sorotte-server/src/**"
      - "crates/sorotte-gui/src/**"
      - "!crates/**/*.md"
      - "!fixtures/**/*.md"
  schedule:
    - cron: "15 4 * * 0"

permissions:
  contents: read

concurrency:
  group: sorotte-mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selection:
    name: Select mutation responsibilities
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.selection.outputs.shards }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Compute immutable base and head shard union
        id: selection
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          HEAD_SHA: ${{ github.sha }}
          FULL: ${{ github.event_name != 'pull_request' && '1' || '' }}
        run: |
          python scripts/mutation_selection.py select --base "$BASE_SHA" --head "$HEAD_SHA" ${FULL:+--full} --output target/verification/mutation-selection.json --github-output "$GITHUB_OUTPUT"
      - name: Retain immutable selection inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sorotte-selected-mutation-plan
          path: target/verification/mutation-selection.json
          if-no-files-found: error
          retention-days: 14

  mutation:
    needs: selection
    if: ${{ needs.selection.outputs.shards != '[]' }}
    name: Mutation (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.selection.outputs.shards) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable resolved 2026-07-28
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install pinned cargo-mutants
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2.85.7
        with:
          tool: cargo-mutants@27.1.0
          fallback: none

      - name: Validate mutation policy
        run: >-
          python scripts/mutation_ci.py validate
          --repo-root .
          --policy coverage/mutation-policy.toml
          --shard ${{ matrix.shard }}

      - name: Run source-bound mutation shard
        run: >-
          python scripts/mutation_ci.py run
          --repo-root .
          --policy coverage/mutation-policy.toml
          --shard ${{ matrix.shard }}
          --results-root target/mutation-ci/${{ matrix.shard }}
          --output target/verification/mutation-${{ matrix.shard }}.json

      - name: Verify mutation evidence matches current source
        run: >-
          python scripts/mutation_ci.py verify-report
          --repo-root .
          --policy coverage/mutation-policy.toml
          --shard ${{ matrix.shard }}
          --report target/verification/mutation-${{ matrix.shard }}.json

      - name: Upload mutation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sorotte-mutation-${{ matrix.shard }}
          path: |
            target/verification/mutation-${{ matrix.shard }}.json
            target/mutation-ci/${{ matrix.shard }}
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  participant-status-evidence-set:
    name: Participant-status mutation evidence set
    if: ${{ always() && (needs.selection.result != 'success' || needs.selection.outputs.shards != '[]') }}
    needs: [selection, mutation]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable resolved 2026-07-28
        with:
          toolchain: 1.97.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Download mutation reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: sorotte-mutation-*
          path: target
          merge-multiple: true

      - name: Download separately named selected reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: sorotte-mutation-*
          path: target/mutation-selected
          merge-multiple: false

      - name: Verify every immutable selected shard exactly once
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          HEAD_SHA: ${{ github.sha }}
          FULL: ${{ github.event_name != 'pull_request' && '1' || '' }}
        run: |
          python scripts/mutation_selection.py verify --base "$BASE_SHA" --head "$HEAD_SHA" ${FULL:+--full} --artifacts target/mutation-selected

      - name: Verify the uniquely selected participant-status report set
        run: >-
          python scripts/mutation_ci.py verify-report-set
          --repo-root .
          --policy coverage/mutation-policy.toml
          --manifest coverage/mutation-report-set.json
