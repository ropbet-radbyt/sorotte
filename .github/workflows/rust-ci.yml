name: sorotte CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
      - "server-v*"
  pull_request:
  workflow_dispatch:
    inputs:
      coverage_base_sha:
        description: Full commit SHA used as the explicit changed-line coverage base
        required: true
        type: string
  schedule:
    - cron: "0 5 * * *"

permissions:
  contents: read

concurrency:
  group: sorotte-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}

env:
  VERIFICATION_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  preflight:
    name: Apparatus preflight (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - name: Checkout
        id: ci_checkout_1066f6c2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python
        id: ci_setup_python_63e0b3e6
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install reviewed policy prerequisites
        id: ci_install_reviewed_policy_prerequisites_63e3ab01
        run: python -m pip install --disable-pip-version-check -r requirements/ci-policy.txt
      - name: Setup actionlint toolchain
        id: ci_setup_actionlint_toolchain_bca40e4c
        if: runner.os == 'Linux'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.x"
          cache: false
      - name: Validate GitHub Actions workflows
        id: ci_validate_github_actions_workflows_02097a68
        if: runner.os == 'Linux'
        shell: bash
        run: |
          command -v shellcheck
          shellcheck --version
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Validate static apparatus and environment
        id: ci_validate_static_apparatus_and_environm_13d8d14c
        run: python scripts/verify.py preflight --phase static --output target/verification/preflight.json
      - name: Run cross-platform apparatus self-tests
        id: ci_run_cross_platform_apparatus_self_test_5b6af0e1
        run: python scripts/verify.py run --lane static --output target/verification/apparatus-selftests --deadline-seconds 300
      - name: Preserve preflight receipt
        id: ci_preserve_preflight_receipt_6e315338
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preflight-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/verification/preflight.json
            target/verification/apparatus-selftests/**
          if-no-files-found: error
          retention-days: 90

  semver:
    name: Public Rust API compatibility
    if: github.event_name != 'schedule'
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        id: ci_checkout_2858a3e2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Rust
        id: ci_setup_rust_dd1a8f55
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable resolved 2026-07-28
        with:
          toolchain: 1.97.1
      - name: Install pinned cargo-semver-checks
        id: ci_install_pinned_cargo_semver_checks_712626c6
        if: github.event_name == 'pull_request'
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2.85.7
        with:
          tool: cargo-semver-checks@0.50.0
          fallback: none
      - name: Enforce public Rust API compatibility
        id: ci_enforce_public_rust_api_compatibility_cc4e4e07
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          baseline_sha="${{ github.event.pull_request.base.sha }}"
          git cat-file -e "${baseline_sha}^{commit}"
          for package in \
            sorotte-secret \
            sorotte-protocol \
            sorotte-core \
            sorotte-server \
            sorotte-media-match \
            sorotte-client-core \
            sorotte-client-app \
            sorotte-player-api \
            sorotte-player-mpv \
            sorotte-lifecycle-evidence \
            sorotte-plex \
            sorotte-cli \
            sorotte-gui \
            sorotte-sim \
            sorotte-compat
          do
            if ! git cat-file -e "${baseline_sha}:crates/${package}/Cargo.toml" 2>/dev/null
            then
              echo "Skipping new package absent from baseline: ${package}"
              continue
            fi
            cargo semver-checks \
              --package "$package" \
              --baseline-rev "$baseline_sha"
          done

  checks:
    needs: preflight
    if: github.event_name != 'schedule'
    name: Rust all-feature contract (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SYNCPLAY_LEGACY_ROOT: ${{ github.workspace }}/.interop-cache/syncplay-legacy
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        id: ci_checkout_d90905a1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout pinned legacy reference for Linux tests
        id: ci_checkout_pinned_legacy_reference_for_l_23ad1e00
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Syncplay/syncplay
          ref: d1c5f85af377c960c5a940707c4d01bc84fd9c3f
          path: .interop-cache/syncplay-legacy
          persist-credentials: false

      - name: Setup Rust
        id: ci_setup_rust_3716b49a
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable resolved 2026-07-28
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Cargo fmt
        id: ci_cargo_fmt_938a90c3
        run: cargo fmt --all --check


      - name: Install pinned cargo-nextest
        id: ci_install_pinned_cargo_nextest_45b95333
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2.85.7
        with:
          tool: cargo-nextest@0.9.137
          fallback: none


      - name: Setup Python
        id: ci_setup_python_5070f49f
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Restore immutable locked crate downloads
        id: ci_restore_immutable_locked_crate_downloa_2f67b294
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5 resolved 2026-09-06
        with:
          path: ~/.cargo/registry/cache
          key: cargo-downloads-${{ runner.os }}-1.97.1-${{ hashFiles('Cargo.lock', 'fuzz/Cargo.lock', 'coverage/verification-tools.toml') }}
      - name: Verify cached archives and reconstruct corrupt inputs
        id: ci_verify_cached_archives_and_reconstruct_01570f70
        run: python scripts/cargo_input_cache.py --lock Cargo.lock --lock fuzz/Cargo.lock --output target/verification/cargo-cache.json


      - name: Cargo clippy
        id: ci_cargo_clippy_62374563
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Install Linux test prerequisites
        id: ci_install_linux_test_prerequisites_873e54bb
        run: python -m pip install --disable-pip-version-check -r requirements/ci-policy.txt -r requirements/legacy-python-interop.txt

      - name: Validate critical responsibility coverage
        id: ci_validate_critical_responsibility_cover_b9f74f9f
        run: python scripts/critical_boundaries.py --repo-root .

      - name: Validate current architecture references
        id: ci_validate_current_architecture_referenc_b959d8a4
        run: python scripts/architecture_index.py --repo-root .

      - name: Validate retained fuzz byte inventory
        id: ci_validate_retained_fuzz_byte_inventory_c35b756f
        run: python scripts/fuzz_regressions.py validate

      - name: Validate behavior catalog
        id: ci_validate_behavior_catalog_c5812aa0
        run: python scripts/behavior_evidence.py validate --catalog coverage/behaviors.toml

      - name: Validate playback lifecycle model
        id: ci_validate_playback_lifecycle_model_5cee5d6c
        run: python scripts/playback_lifecycle_model.py validate --model coverage/playback-lifecycle.toml

      - name: Execute playback lifecycle oracle
        id: ci_execute_playback_lifecycle_oracle_83540f12
        run: >-
          python scripts/playback_lifecycle_oracle.py witness-summary
          --model coverage/playback-lifecycle.toml
          --compact

      - name: Replay playback lifecycle seeds
        id: ci_replay_playback_lifecycle_seeds_2a1d6bcf
        run: >-
          python scripts/playback_lifecycle_oracle.py run-suite
          --schedule-dir fixtures/playback-lifecycle

      - name: Required state-aware playback lifecycle exploration
        id: lifecycle_explore
        continue-on-error: true
        run: >-
          python scripts/playback_lifecycle_oracle.py explore
          --model coverage/playback-lifecycle.toml
          --seed 0x50A077E20260831
          --cases 64
          --steps 128
          --failure-dir target/verification/playback-lifecycle-model-failures
          --compact

      - name: Upload minimized lifecycle model failures
        id: ci_upload_minimized_lifecycle_model_failu_bad90c2c
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playback-lifecycle-model-failures
          path: target/verification/playback-lifecycle-model-failures
          if-no-files-found: ignore
          retention-days: 14
          overwrite: true

      - name: Enforce state-aware playback lifecycle exploration
        id: ci_enforce_state_aware_playback_lifecycle_69221c7a
        if: always()
        env:
          LIFECYCLE_EXPLORE_OUTCOME: ${{ steps.lifecycle_explore.outcome }}
        run: test "$LIFECYCLE_EXPLORE_OUTCOME" = success

      - name: Validate ignored test policy
        id: ci_validate_ignored_test_policy_0e7c4525
        run: python scripts/ignored_test_policy.py validate --registry coverage/ignored-tests.toml

      - name: Validate known-defect characterizations
        id: ci_validate_known_defect_characterization_a3b12695
        run: >-
          python scripts/known_defect_policy.py validate
          --registry coverage/known-defects.toml
          --catalog coverage/behaviors.toml

      - name: Execute subprocess-fixture parent contracts
        id: ci_execute_subprocess_fixture_parent_cont_0e28da11
        run: |
          cargo nextest run --locked -p sorotte-gui --lib --all-features --no-tests fail -E 'test(=app::runtime_queue::tests::process_shutdown::gui_blocked_owner_parent_exit_terminates_owned_player_and_preserves_external_player)'
          cargo nextest run --locked -p sorotte-media-match --lib --all-features --no-tests fail -E 'test(=extraction::process::tests::cancellation_after_audio_launch_is_not_a_degraded_fingerprint)'
          cargo nextest run --locked -p sorotte-player-mpv --lib --all-features --no-tests fail -E 'test(=bridge_resource::security_tests::independent_processes_repair_one_corrupt_cache_without_partial_publication)'
          cargo nextest run --locked -p sorotte-player-mpv --lib --all-features --no-tests fail -E 'test(=managed_process::tests::independent_scope_terminates_child_when_blocked_owner_parent_exits)'




      - name: Nextest fail-on-flaky workspace tests
        id: nextest
        continue-on-error: true
        run: python scripts/nextest_ci.py run --repo-root .

      - name: Cargo doctests
        id: doctests
        continue-on-error: true
        run: cargo test --locked --workspace --all-features --doc

      - name: Upload Linux nextest attempt evidence
        id: ci_upload_linux_nextest_attempt_evidence_419fdb81
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nextest-attempts-linux-${{ github.run_attempt }}
          path: target/nextest/ci
          if-no-files-found: error
          retention-days: 14
          overwrite: true

      - name: Enforce complete Linux test gate
        id: ci_enforce_complete_linux_test_gate_00ae2b22
        if: always()
        env:
          NEXTEST_OUTCOME: ${{ steps.nextest.outcome }}
          DOCTEST_OUTCOME: ${{ steps.doctests.outcome }}
        run: |
          test "$NEXTEST_OUTCOME" = success
          test "$DOCTEST_OUTCOME" = success

      - name: Cache-pause acknowledged-stream regression
        id: ci_cache_pause_acknowledged_stream_regres_e4d87df7
        run: >-
          cargo test --locked -p sorotte-player-mpv --all-features
          --test repro_acknowledged_cache_pause

  lifecycle_contract:
    needs: preflight
    if: github.event_name != 'schedule'
    name: lifecycle-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        id: ci_checkout_1193c5c5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.VERIFICATION_SHA }}
          persist-credentials: false

      - name: Setup Rust
        id: ci_setup_rust_0c0f6add
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable resolved 2026-07-28
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Setup Python
        id: ci_setup_python_e2be83f8
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Reducer and acceptance lifecycle inventory
        id: reducer
        continue-on-error: true
        run: >-
          cargo test --locked -p sorotte-player-mpv --all-features --lib
          lifecycle:: -- --nocapture

      - name: GUI lifecycle projection inventory
        id: projection
        continue-on-error: true
        run: >-
          cargo test --locked -p sorotte-gui --all-features --lib
          lifecycle_verification_tests -- --test-threads=1

      - name: GUI ordered-delivery inventory
        id: delivery
        continue-on-error: true
        run: >-
          cargo test --locked -p sorotte-gui --all-features --lib
          ordered_delivery_tests -- --nocapture --test-threads=1

      - name: Run exact behavior proofs
        id: evidence
        continue-on-error: true
        run: >-
          python scripts/behavior_evidence.py run-lane
          --catalog coverage/behaviors.toml
          --lane lifecycle-contract
          --sha "$VERIFICATION_SHA"
          --repository "${{ github.repository }}"
          --run-id "${{ github.run_id }}"
          --run-attempt "${{ github.run_attempt }}"
          --os linux
          --output target/verification/evidence.lifecycle-contract.json

      - name: Upload lifecycle evidence
        id: ci_upload_lifecycle_evidence_17bb7f16
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-lifecycle-contract
          path: target/verification/evidence.lifecycle-contract.json
          if-no-files-found: warn
          retention-days: 14
          overwrite: true

      - name: Enforce complete lifecycle lane
        id: ci_enforce_complete_lifecycle_lane_96f93b31
        if: always()
        env:
          REDUCER_OUTCOME: ${{ steps.reducer.outcome }}
          PROJECTION_OUTCOME: ${{ steps.projection.outcome }}
          DELIVERY_OUTCOME: ${{ steps.delivery.outcome }}
          EVIDENCE_OUTCOME: ${{ steps.evidence.outcome }}
        run: |
          test "$REDUCER_OUTCOME" = success
          test "$PROJECTION_OUTCOME" = success
          test "$DELIVERY_OUTCOME" = success
          test "$EVIDENCE_OUTCOME" = success

  gui_semantic:
    needs: preflight
    if: github.event_name != 'schedule'
    name: gui-semantic
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SYNCPLAY_LEGACY_ROOT: ${{ github.workspace }}/.interop-cache/syncplay-legacy
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/gui-semantic
    steps:
      - name: Checkout prospective merge revision
        id: ci_checkout_prospective_merge_revision_f3dc527d
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout pinned legacy reference
        id: ci_checkout_pinned_legacy_reference_1abca5c1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Syncplay/syncplay
          ref: d1c5f85af377c960c5a940707c4d01bc84fd9c3f
          path: .interop-cache/syncplay-legacy
          persist-credentials: false

      - name: Setup Rust
        id: ci_setup_rust_53ae2e1b
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable resolved 2026-07-28
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Setup Python
        id: ci_setup_python_d47dc5c6
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install live semantic prerequisites
        id: ci_install_live_semantic_prerequisites_b5a7d470
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/legacy-python-interop.txt

      - name: Run complete semantic inventory on prospective merge
        id: ci_run_complete_semantic_inventory_on_pro_d722ebb5
        run: >-
          cargo run --quiet --locked -p sorotte-gui
          --features gui-semantic-smoke,live-python-interop
          --bin sorotte-gui-semantic-suite --
          --json

      - name: Checkout exact evidence revision
        id: ci_checkout_exact_evidence_revision_4cd22c15
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.VERIFICATION_SHA }}
          path: evidence-source
          persist-credentials: false

      - name: Reconcile exact evidence prerequisites
        id: ci_reconcile_exact_evidence_prerequisites_103d4314
        working-directory: evidence-source
        run: python -m pip install --disable-pip-version-check -r requirements/legacy-python-interop.txt

      - name: Run complete semantic inventory
        id: evidence
        continue-on-error: true
        working-directory: evidence-source
        run: >-
          python scripts/behavior_evidence.py run-lane
          --catalog coverage/behaviors.toml
          --lane gui-semantic
          --sha "$VERIFICATION_SHA"
          --repository "${{ github.repository }}"
          --run-id "${{ github.run_id }}"
          --run-attempt "${{ github.run_attempt }}"
          --os linux
          --output target/verification/evidence.gui-semantic.json

      - name: Upload semantic evidence
        id: ci_upload_semantic_evidence_de4e304b
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-gui-semantic
          path: evidence-source/target/verification/evidence.gui-semantic.json
          if-no-files-found: warn
          retention-days: 14
          overwrite: true

      - name: Enforce complete semantic lane
        id: ci_enforce_complete_semantic_lane_157f9651
        if: always()
        env:
          EVIDENCE_OUTCOME: ${{ steps.evidence.outcome }}
        run: test "$EVIDENCE_OUTCOME" = success

  rust_windows_tests:
    needs: preflight
    if: github.event_name != 'schedule'
    name: Windows all-feature tests
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      SYNCPLAY_LEGACY_ROOT: ${{ github.workspace }}\.interop-cache\syncplay-legacy
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout Sorotte
        id: ci_checkout_sorotte_ddf2e145
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout pinned legacy reference
        id: ci_checkout_pinned_legacy_reference_f8abf6a8
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Syncplay/syncplay
          ref: d1c5f85af377c960c5a940707c4d01bc84fd9c3f
          path: .interop-cache/syncplay-legacy
          persist-credentials: false

      - name: Setup Rust
        id: ci_setup_rust_a4bd0f12
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable resolved 2026-07-28
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Install pinned cargo-nextest
        id: ci_install_pinned_cargo_nextest_5e3279cd
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2.85.7
        with:
          tool: cargo-nextest@0.9.137
          fallback: none

      - name: Setup Python
        id: ci_setup_python_a95e0bb1
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Restore immutable locked crate downloads
        id: ci_restore_immutable_locked_crate_downloa_a170feb4
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5 resolved 2026-09-06
        with:
          path: ~/.cargo/registry/cache
          key: cargo-downloads-${{ runner.os }}-1.97.1-${{ hashFiles('Cargo.lock', 'fuzz/Cargo.lock', 'coverage/verification-tools.toml') }}
      - name: Verify cached archives and reconstruct corrupt inputs
        id: ci_verify_cached_archives_and_reconstruct_ec66cc47
        run: python scripts/cargo_input_cache.py --lock Cargo.lock --lock fuzz/Cargo.lock --output target/verification/cargo-cache.json


      - name: Validate Windows semver wrapper
        id: ci_validate_windows_semver_wrapper_6ba0767b
        shell: pwsh
        run: python -m unittest scripts.tests.test_semver_wrapper -v

      - name: Install live compatibility prerequisites
        id: ci_install_live_compatibility_prerequisit_d64088f1
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/legacy-python-interop.txt

      - name: Check reviewed compile-dependent inventories
        id: ci_check_reviewed_compile_dependent_inven_57396f6a
        run: python scripts/test_inventory.py check --output target/verification/test-inventory.json

      - name: Nextest fail-on-flaky workspace tests
        id: nextest
        continue-on-error: true
        shell: pwsh
        run: python scripts/nextest_ci.py run --repo-root .

      - name: Cargo doctests
        id: doctests
        continue-on-error: true
        shell: pwsh
        run: cargo test --locked --workspace --all-features --doc

      - name: Upload Windows nextest attempt evidence
        id: ci_upload_windows_nextest_attempt_evidenc_3a3e4ff8
        if: always()
