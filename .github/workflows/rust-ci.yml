name: syncplay-rs CI

on:
  push:
    paths:
      - "syncplay-rs/**"
  pull_request:
    paths:
      - "syncplay-rs/**"

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: syncplay-rs
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cargo fmt
        run: cargo fmt --check

      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Cargo test
        run: cargo test --workspace

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install legacy TLS parity prerequisites
        run: |
          python -m pip install --upgrade pip
          python -m pip install twisted pyopenssl service_identity

      - name: Strict live legacy TLS parity
        env:
          SYNCPLAY_ASSERT_LEGACY_FANOUT_PARITY: "1"
          SYNCPLAY_REQUIRE_LEGACY_TLS_PARITY: "1"
        run: cargo test -p syncplay-compat legacy_server_live_tls_ -- --nocapture
