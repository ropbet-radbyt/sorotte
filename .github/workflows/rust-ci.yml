name: sorotte CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"

jobs:
  checks:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Cargo fmt
        run: cargo fmt --all --check

      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Cargo test
        run: cargo test --workspace

  gui-windows-release-build:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    name: GUI release build (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1

      # This is intentionally a compilation-only gate. Packaging, artifact
      # upload, tag mutation, and GitHub Release writes remain owned by the
      # dedicated release workflow.
      - name: Build distributed GUI release binaries
        shell: pwsh
        run: >-
          cargo build --release -p sorotte-gui
          --bin sorotte-gui --bin sorotte-gui-updater

  compat-live-tls:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    needs: checks
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install legacy TLS parity prerequisites
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/legacy-python-interop.txt

      - name: Strict live legacy TLS parity
        env:
          SYNCPLAY_ASSERT_LEGACY_FANOUT_PARITY: "1"
          SYNCPLAY_REQUIRE_LEGACY_TLS_PARITY: "1"
        run: cargo test -p sorotte-compat legacy_server_live_tls_ -- --nocapture

  mpv-pr-semantics:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout Sorotte
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1

      - name: Install supported mpv build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libass-dev \
            libavcodec-dev \
            libavfilter-dev \
            libavformat-dev \
            libavutil-dev \
            liblua5.2-dev \
            libplacebo-dev \
            libswresample-dev \
            libswscale-dev \
            meson \
            ninja-build \
            pkg-config

      - name: Checkout minimum supported official mpv
        uses: actions/checkout@v4
        with:
          repository: mpv-player/mpv
          ref: v0.41.0
          path: target/mpv-supported

      - name: Build minimum supported mpv
        working-directory: target/mpv-supported
        run: |
          meson setup build \
            -Dalsa=disabled \
            -Dbuild-date=false \
            -Ddrm=disabled \
            -Dgl=disabled \
            -Dlibmpv=false \
            -Dlua=enabled \
            -Dmanpage-build=disabled \
            -Dpipewire=disabled \
            -Dpulse=disabled \
            -Dtests=false \
            -Dvaapi=disabled \
            -Dvulkan=disabled \
            -Dwayland=disabled \
            -Dx11=disabled
          # v0.41 exposes both the executable and an internal shared-library
          # target as `mpv`; qualify the target so Meson does not reject the
          # otherwise ambiguous name.
          meson compile -C build ./mpv:executable

      - name: Verify supported mpv version
        run: |
          export PATH="$GITHUB_WORKSPACE/target/mpv-supported/build:$PATH"
          python3 - <<'PY'
          import re
          import subprocess

          first_line = subprocess.check_output(["mpv", "--version"], text=True).splitlines()[0]
          match = re.search(r"\b(\d+)\.(\d+)(?:\.|\b)", first_line)
          assert match, f"could not parse mpv version: {first_line}"
          version = tuple(map(int, match.groups()))
          assert version >= (0, 41), f"expected mpv 0.41 or newer, received: {first_line}"
          print(first_line)
          PY

      - name: Required real mpv pause, seek, resume, and bounded-fetch semantics
        run: |
          export PATH="$GITHUB_WORKSPACE/target/mpv-supported/build:$PATH"
          cargo test -p sorotte-sim --test mpv_rebuffer_harness \
            real_mpv_pause_seek_resume_semantics -- --ignored --exact --nocapture

      - name: Required real mpv cache-cap drain and input-resume semantics
        run: |
          export PATH="$GITHUB_WORKSPACE/target/mpv-supported/build:$PATH"
          cargo test -p sorotte-sim --test mpv_rebuffer_harness \
            real_mpv_cache_cap_drains_and_input_resumes \
            -- --ignored --exact --nocapture

      - name: Full deterministic HTTP-stall and rebuffer harness
        run: |
          export PATH="$GITHUB_WORKSPACE/target/mpv-supported/build:$PATH"
          cargo test -p sorotte-sim --test mpv_rebuffer_harness \
            real_mpv_clients_keep_seek_recovery_bounded_during_an_http_stall \
            -- --ignored --exact --nocapture

  nightly-deep:
    if: github.event_name == 'schedule'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-22.04]
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Cargo test
        run: cargo test --workspace

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install legacy TLS parity prerequisites
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/legacy-python-interop.txt

      - name: Strict live legacy TLS parity
        env:
          SYNCPLAY_ASSERT_LEGACY_FANOUT_PARITY: "1"
          SYNCPLAY_REQUIRE_LEGACY_TLS_PARITY: "1"
        run: cargo test -p sorotte-compat legacy_server_live_tls_ -- --nocapture

  server-release-verify:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install server release prerequisites
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/legacy-python-interop.txt

      - name: Strict server release verification
        shell: pwsh
        run: ./scripts/server-release-verify.ps1
