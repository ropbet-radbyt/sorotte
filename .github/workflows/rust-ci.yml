name: sorotte CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"

jobs:
  checks:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Cargo fmt
        run: cargo fmt --check

      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Cargo test
        run: cargo test --workspace

  compat-live-tls:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    needs: checks
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install legacy TLS parity prerequisites
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/legacy-python-interop.txt

      - name: Strict live legacy TLS parity
        env:
          SYNCPLAY_ASSERT_LEGACY_FANOUT_PARITY: "1"
          SYNCPLAY_REQUIRE_LEGACY_TLS_PARITY: "1"
        run: cargo test -p sorotte-compat legacy_server_live_tls_ -- --nocapture

  nightly-deep:
    if: github.event_name == 'schedule'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-22.04]
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Cargo test
        run: cargo test --workspace

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install legacy TLS parity prerequisites
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/legacy-python-interop.txt

      - name: Strict live legacy TLS parity
        env:
          SYNCPLAY_ASSERT_LEGACY_FANOUT_PARITY: "1"
          SYNCPLAY_REQUIRE_LEGACY_TLS_PARITY: "1"
        run: cargo test -p sorotte-compat legacy_server_live_tls_ -- --nocapture

  server-release-verify:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install server release prerequisites
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/legacy-python-interop.txt

      - name: Strict server release verification
        shell: pwsh
        run: ./scripts/server-release-verify.ps1
