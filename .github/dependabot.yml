version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      rust-patches:
        update-types: [patch]
  - package-ecosystem: pip
    directory: /requirements
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      verification-patches:
        update-types: [patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
# No automerge. Every PR retains existing compatibility, behavior, coverage,
# mutation and immutable action/tool pin checks. Major/minor upgrades stay separate.
