[alias]
fmt-check = "fmt --check"
lint = "clippy --workspace --all-targets -- -D warnings"
test-all = "test --workspace"
test-fast = "test --workspace --lib"
cov-clean = "llvm-cov clean --workspace"
cov-lcov = "llvm-cov --workspace --lcov --output-path target/llvm-cov/lcov.info"
cov-html = "llvm-cov --workspace --html --output-dir target/llvm-cov/html"
