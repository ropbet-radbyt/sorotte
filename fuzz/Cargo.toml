[package]
name = "sorotte-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
serde = "=1.0.229"
serde_json = "=1.0.151"
sorotte-protocol = { path = "../crates/sorotte-protocol" }

[[bin]]
name = "protocol_line"
path = "fuzz_targets/protocol_line.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
resolver = "2"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
