[package]
name = "sorotte-player-mpv"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = []
fuzz-support = ["test-support"]
test-support = ["sorotte-player-api/test-support"]

[dependencies]
anyhow.workspace = true
getrandom.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sorotte-player-api = { path = "../sorotte-player-api" }
sorotte-lifecycle-evidence = { path = "../sorotte-lifecycle-evidence" }
sorotte-secret = { path = "../sorotte-secret" }
url.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_JobObjects", "Win32_Security_Authorization"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
mlua.workspace = true
proptest.workspace = true
sorotte-client-core = { path = "../sorotte-client-core", features = ["test-support"] }

[[test]]
name = "repro_acknowledged_cache_pause"
path = "tests/repro_acknowledged_cache_pause.rs"
required-features = ["test-support"]
