[package]
name = "syncplay-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"
test = false

[dependencies]
eframe = "0.33.3"
egui = "0.33.3"
rfd = "0.15.4"
syncplay-compat = { path = "../syncplay-compat" }
syncplay-client-app = { path = "../syncplay-client-app" }
syncplay-client-core = { path = "../syncplay-client-core" }
syncplay-player-api = { path = "../syncplay-player-api" }
syncplay-player-mpv = { path = "../syncplay-player-mpv" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Accessibility"] }

[[bin]]
name = "syncplay-gui-semantic-smoke"
path = "src/bin/syncplay-gui-semantic-smoke.rs"
test = false

[[bin]]
name = "syncplay-gui-semantic-suite"
path = "src/bin/syncplay-gui-semantic-suite.rs"
test = false

[[bin]]
name = "syncplay-gui-native-smoke"
path = "src/bin/syncplay-gui-native-smoke.rs"
test = false
