[package]
name = "syncplay-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
eframe = "0.33.3"
egui = "0.33.3"
reqwest = { version = "0.12.23", default-features = false, features = ["blocking", "rustls-tls-webpki-roots-no-provider"] }
rfd = "0.15.4"
rustls.workspace = true
serde_json = "1.0.149"
sha2.workspace = true
syncplay-compat = { path = "../syncplay-compat" }
syncplay-client-app = { path = "../syncplay-client-app" }
syncplay-client-core = { path = "../syncplay-client-core" }
syncplay-player-api = { path = "../syncplay-player-api" }
syncplay-player-mpv = { path = "../syncplay-player-mpv" }
syncplay-protocol = { path = "../syncplay-protocol" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Accessibility"] }

[[bin]]
name = "syncplay-gui-semantic-smoke"
path = "src/bin/syncplay-gui-semantic-smoke.rs"
test = false

[[bin]]
name = "syncplay-gui-semantic-suite"
path = "src/bin/syncplay-gui-semantic-suite.rs"
test = false

[[bin]]
name = "syncplay-gui-native-smoke"
path = "src/bin/syncplay-gui-native-smoke.rs"
test = false
