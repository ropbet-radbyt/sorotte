[package]
name = "syncplay-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[lints]
workspace = true

[features]
default = []
gui-semantic-smoke = []
gui-native-smoke = ["live-python-interop"]
live-python-interop = ["dep:syncplay-compat"]

[dependencies]
eframe.workspace = true
egui.workspace = true
reqwest.workspace = true
rfd.workspace = true
rustls.workspace = true
rustls-pemfile.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
zip.workspace = true
syncplay-compat = { path = "../syncplay-compat", optional = true }
syncplay-client-app = { path = "../syncplay-client-app" }
syncplay-client-core = { path = "../syncplay-client-core" }
syncplay-player-api = { path = "../syncplay-player-api" }
syncplay-player-mpv = { path = "../syncplay-player-mpv" }
syncplay-plex = { path = "../syncplay-plex" }
syncplay-protocol = { path = "../syncplay-protocol" }
webpki-roots.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
windows.workspace = true

[[bin]]
name = "syncplay-gui-semantic-smoke"
path = "src/bin/syncplay-gui-semantic-smoke.rs"
test = false
required-features = ["gui-semantic-smoke", "live-python-interop"]

[[bin]]
name = "syncplay-gui-semantic-suite"
path = "src/bin/syncplay-gui-semantic-suite.rs"
test = false
required-features = ["gui-semantic-smoke", "live-python-interop"]

[[bin]]
name = "syncplay-gui-native-smoke"
path = "src/bin/syncplay-gui-native-smoke.rs"
test = false
required-features = ["gui-native-smoke"]

[[bin]]
name = "syncplay-gui-startup-bench"
path = "src/bin/syncplay-gui-startup-bench.rs"
