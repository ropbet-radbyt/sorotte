[[step]]
id = "late-status-unavailable-two"
transition = "STATUS-UNAVAILABLE-001"
subject = "client-late"
causes = ["late-status-old-ignored"]
identities = { membership_epoch = 2 }
trigger = "server-snapshot"

[[step]]
id = "late-status-awaiting-two"
transition = "STATUS-NEGOTIATE-001"
subject = "client-late"
causes = ["late-status-unavailable-two"]
identities = { membership_epoch = 2 }
trigger = "status"

[[step]]
id = "late-status-fresh-two"
transition = "STATUS-FRESH-001"
subject = "client-late"
causes = ["late-status-awaiting-two"]
identities = { membership_epoch = 2, report_sequence = 1 }
trigger = "status"

[[step]]
id = "playlist-reinstalled"
transition = "PLAYLIST-SNAPSHOT-SELECTED-001"
subject = "room"
causes = ["late-status-fresh-two"]
identities = { playlist_revision = 5, playlist_index_revision = 9 }
trigger = "server-snapshot"

[[step]]
id = "late-load-superseded-one"
transition = "LOAD-SUPERSEDE-001"
subject = "client-late"
causes = ["playlist-reinstalled"]
identities = { attachment_epoch = 1, media_generation = 1, load_attempt = 1 }
