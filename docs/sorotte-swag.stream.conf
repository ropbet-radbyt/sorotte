# SWAG/nginx TCP stream proxy for Sorotte.
#
# The Syncplay protocol is raw TCP on port 8999, not HTTP/WebSocket. Do not place this in
# /config/nginx/proxy-confs/*.subdomain.conf. Put this stream block at the top
# level of SWAG's /config/nginx/nginx.conf, beside the existing http { ... }
# block, or include it from there.
#
# SWAG must publish TCP 8999, and your router must forward TCP 8999 to SWAG.
# The Sorotte container should be on the same Docker network as SWAG and does
# not need to publish host port 8999 when SWAG owns the public listener.

stream {
    upstream sorotte_server {
        # Change this hostname if your Unraid container name is different.
        server sorotte-server:8999;

        # If you prefer proxying through the Unraid host/LAN address instead,
        # comment the line above and use something like:
        # server 192.168.1.10:8999;
    }

    server {
        listen 8999;

        proxy_pass sorotte_server;
        proxy_connect_timeout 10s;
        proxy_timeout 24h;
        proxy_socket_keepalive on;
    }
}
