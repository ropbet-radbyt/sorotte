schema_version = 1
# These inputs can alter any selector, feature graph, compiler or evidence reader.
global_inputs = ["Cargo.toml", "Cargo.lock", "rust-toolchain.toml", ".cargo/**", "coverage/mutation-*.toml", "coverage/mutation-report-set.json", "scripts/mutation*.py", "scripts/artifact_input.py", ".github/workflows/rust-mutation.yml"]

# Package sources, tests, build scripts and feature manifests automatically select
# that package's shards. These additional edges declare cross-package contracts.
[[dependency]]
paths = ["crates/sorotte-secret/**"]
shards = ["privacy-secret", "client-runtime-config", "settings-duplicate-keys", "plex-http-origin", "server-auth"]

[[dependency]]
paths = ["crates/sorotte-protocol/**", "fixtures/**"]
shards = ["protocol-codec", "client-ping", "client-inbound-order", "cli-framing", "server-auth", "server-local-clock", "server-resource-permits"]

[[dependency]]
paths = ["crates/sorotte-client-core/**", "crates/sorotte-core/**"]
shards = ["client-reconnect-state", "client-ping", "client-runtime-config", "client-inbound-order", "client-playlist-shuffle"]

[[dependency]]
paths = ["crates/sorotte-client-app/src/sorotte_ini/**", "crates/sorotte-client-app/src/sorotte_ini.rs", "crates/sorotte-gui/src/app/runtime_owner/requests/**", "crates/sorotte-cli/src/stored_settings*"]
shards = ["settings-duplicate-keys", "client-runtime-config"]

[[dependency]]
paths = ["crates/sorotte-server/src/network/**", "crates/sorotte-server/src/network.rs", "crates/sorotte-server/src/backpressure.rs", "crates/sorotte-server/src/frame_limits.rs"]
shards = ["server-resource-permits", "server-local-clock", "protocol-codec"]
