risk = "critical"
invariants = ["LIFE-EPOCH-001", "LIFE-IDENT-001", "LIFE-EXIT-001"]
evidence = ["NET-DEADLINE-001", "NET-CODEC-001", "NET-TLS-001", "SYNC-LIFECYCLE-001"]
covered_tiers = ["model", "seam"]
required_tiers = ["model", "seam", "system"]
gaps = ["GAP-SYSTEM-001", "GAP-FAULT-001", "GAP-TRACE-001"]

[[machine.transition]]
id = "SESSION-ACTIVE-001"
title = "Activate connection generation"
from = ["awaiting-hello"]
to = "active"
cause = "A valid server Hello installs negotiated identity and capabilities."
authority = "server-session"
risk = "critical"
invariants = ["LIFE-EPOCH-001", "LIFE-SNAPSHOT-001", "LIFE-REJOIN-001"]
evidence = ["NET-DEADLINE-001", "NET-CODEC-001", "NET-RECONNECT-001", "SYNC-LIFECYCLE-001"]
covered_tiers = ["model", "seam"]
required_tiers = ["model", "seam", "system"]
gaps = ["GAP-SYSTEM-001", "GAP-FAULT-001", "GAP-TRACE-001"]

[[machine.transition]]
