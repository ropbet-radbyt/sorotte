mode = "cyclic"
initial_state = "absent"
terminal_states = []

[[machine.state]]
id = "absent"
title = "Absent"
kind = "stable"
description = "No player attachment owns observations or commands."

[[machine.state]]
id = "launching"
title = "Launching"
kind = "transient"
description = "An owned player process is being created."

[[machine.state]]
id = "connecting"
title = "Connecting"
kind = "transient"
description = "The client is establishing and validating player IPC."

[[machine.state]]
id = "attached"
title = "Attached"
kind = "stable"
description = "One attachment epoch owns commands and observations."

[[machine.state]]
id = "disconnected"
title = "Disconnected"
kind = "transient"
description = "The attachment is unavailable and successor policy is being decided."

[[machine.state]]
id = "relaunching"
title = "Relaunching"
kind = "transient"
description = "A bounded successor player is being created under a new attachment epoch."

[[machine.state]]
id = "stopped"
title = "Stopped"
kind = "stable"
description = "The former attachment is terminal and owns no live resource."

