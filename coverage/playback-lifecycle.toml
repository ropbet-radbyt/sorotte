title = "Fence lost connection"
from = ["connecting", "awaiting-hello", "active"]
to = "reconnecting"
cause = "Transport failure or liveness deadline retires the connection generation."
authority = "client-session"
risk = "critical"
invariants = ["LIFE-EPOCH-001", "LIFE-ONCE-001", "LIFE-REJOIN-001", "LIFE-FAILURE-001"]
evidence = ["NET-RECONNECT-001", "NET-DEADLINE-001", "NET-GUI-001", "SYNC-LIFECYCLE-001"]
covered_tiers = ["model", "seam"]
required_tiers = ["model", "seam", "system"]
gaps = ["GAP-SYSTEM-001", "GAP-FAULT-001", "GAP-TRACE-001"]

[[machine.transition]]
id = "SESSION-CLOSE-001"
title = "Begin session close"
from = ["connecting", "awaiting-hello", "active", "reconnecting"]
to = "closing"
cause = "Application shutdown or explicit disconnect stops successor retry."
authority = "client-session"
risk = "high"
invariants = ["LIFE-EPOCH-001", "LIFE-SHUTDOWN-001", "LIFE-EXIT-001"]
evidence = ["NET-RECONNECT-001", "NET-GUI-001"]
covered_tiers = ["model", "seam"]
required_tiers = ["model", "seam", "system"]
