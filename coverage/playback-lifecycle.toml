kind = "transient"
description = "Transport exists but canonical server identity and features are not installed."

[[machine.state]]
id = "active"
title = "Active"
kind = "stable"
description = "One validated connection generation owns session traffic."

[[machine.state]]
id = "reconnecting"
title = "Reconnecting"
kind = "transient"
description = "Old connection-scoped work is fenced while retry policy selects a successor."

[[machine.state]]
id = "closing"
title = "Closing"
kind = "transient"
description = "New traffic is stopped and connection resources drain."

[[machine.transition]]
id = "SESSION-CONNECT-001"
title = "Begin connection"
from = ["disconnected", "reconnecting"]
to = "connecting"
cause = "Initial connection or bounded retry becomes due."
