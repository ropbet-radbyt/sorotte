covered_tiers = ["model", "seam"]
required_tiers = ["model", "seam", "system"]
gaps = ["GAP-MODEL-001", "GAP-SYSTEM-001", "GAP-TRACE-001"]

[[machine.transition]]
id = "PLAYER-CONNECT-001"
title = "Connect player IPC"
from = ["launching", "relaunching"]
to = "connecting"
cause = "The player process exposes its IPC endpoint."
authority = "player-owner"
risk = "high"
invariants = ["LIFE-EPOCH-001", "LIFE-IDENT-001", "LIFE-EXIT-001"]
evidence = ["PL-IPC-001", "PL-IPC-003", "PL-PROC-001"]
covered_tiers = ["model", "seam"]
required_tiers = ["model", "seam", "system"]
gaps = ["GAP-SYSTEM-001", "GAP-TRACE-001"]

[[machine.transition]]
id = "PLAYER-ATTACH-001"
title = "Activate attachment"
from = ["connecting"]
to = "attached"
