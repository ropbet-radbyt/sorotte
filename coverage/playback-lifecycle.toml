risk = "critical"
invariants = ["LIFE-EPOCH-001", "LIFE-IDENT-001", "LIFE-TRACE-001"]
evidence = ["PL-EPOCH-001", "PL-STALE-001", "PL-PROC-001"]
covered_tiers = ["model", "seam"]
required_tiers = ["model", "seam", "system"]
gaps = ["GAP-SYSTEM-001", "GAP-TRACE-001"]

[[machine.transition]]
id = "PLAYER-LOSS-001"
title = "Lose active attachment"
from = ["connecting", "attached"]
to = "disconnected"
cause = "IPC or player process ownership ends unexpectedly."
authority = "player-owner"
risk = "critical"
invariants = ["LIFE-EPOCH-001", "LIFE-ONCE-001", "LIFE-RECOVERY-001", "LIFE-FAILURE-001"]
evidence = ["PL-EPOCH-001", "PL-STALE-001", "PL-IPC-003", "PL-PROC-001"]
covered_tiers = ["model", "seam"]
required_tiers = ["model", "seam", "system"]
gaps = ["GAP-SYSTEM-001", "GAP-FAULT-001", "GAP-TRACE-001"]

[[machine.transition]]
id = "PLAYER-RELAUNCH-001"
title = "Allocate replacement attachment"
from = ["disconnected"]
to = "relaunching"
cause = "Bounded recovery policy authorizes a successor player."
authority = "player-owner"
risk = "critical"
invariants = ["LIFE-EPOCH-001", "LIFE-RECOVERY-001", "LIFE-EXIT-001"]
evidence = ["PL-EPOCH-001", "PL-RECOVERY-001", "PL-PROC-001"]
covered_tiers = ["model", "seam"]
required_tiers = ["model", "seam", "system"]
gaps = ["GAP-SYSTEM-001", "GAP-FAULT-001", "GAP-TRACE-001"]

[[machine.transition]]
id = "PLAYER-STOP-001"
title = "Stop attachment"
from = ["attached", "disconnected", "launching", "connecting", "relaunching"]
to = "stopped"
cause = "Shutdown or terminal player failure ends attachment ownership."
authority = "player-owner"
risk = "high"
invariants = ["LIFE-EPOCH-001", "LIFE-SHUTDOWN-001", "LIFE-FAILURE-001"]
evidence = ["PL-PROC-001", "PL-STALE-001"]
covered_tiers = ["model", "seam"]
required_tiers = ["model", "seam", "system"]
gaps = ["GAP-SYSTEM-001", "GAP-TRACE-001"]

[[machine.transition]]
id = "PLAYER-RESET-001"
title = "Return to absent"
from = ["stopped"]
to = "absent"
cause = "Terminal attachment bookkeeping is released."
authority = "player-owner"
risk = "medium"
invariants = ["LIFE-EPOCH-001", "LIFE-SHUTDOWN-001"]
evidence = ["PL-PROC-001"]
covered_tiers = ["model", "seam"]
required_tiers = ["model", "seam"]
gaps = ["GAP-MODEL-001"]

[[machine]]
id = "session"
title = "Client-server session"
mode = "cyclic"
initial_state = "disconnected"
terminal_states = []

[[machine.state]]
id = "disconnected"
title = "Disconnected"
kind = "stable"
description = "No connection generation owns server traffic."

[[machine.state]]
id = "connecting"
title = "Connecting"
kind = "transient"
description = "A transport attempt is in progress."

[[machine.state]]
id = "awaiting-hello"
