risk = "high"
invariants = ["LIFE-EPOCH-001", "LIFE-EXIT-001", "LIFE-TRACE-001"]
evidence = ["NET-DEADLINE-001", "NET-RECONNECT-001", "SYNC-LIFECYCLE-001"]
