schema_version = 1
model_id = "sorotte-playback-lifecycle-v1"
title = "Sorotte whole-playback lifecycle"
contract = "docs/PLAYBACK_LIFECYCLE_ASSURANCE.md"
behavior_catalog = "coverage/behaviors.toml"

[policy]
allowed_risks = ["critical", "high", "medium", "low"]
required_tiers = ["model", "seam", "system"]
allowed_state_kinds = ["stable", "transient", "terminal"]
allowed_machine_modes = ["finite", "cyclic"]
allowed_gap_statuses = ["open", "closed"]
allowed_invariant_kinds = ["safety", "liveness", "observability", "privacy"]

[[invariant]]
id = "LIFE-AUTH-001"
kind = "safety"
statement = "Only a validated server transition changes canonical room playstate or playlist selection; while an authorized local play or pause intent is pending, that semantic intent rather than a preceding player observation is the only local value allowed to request the transition."

[[invariant]]
id = "LIFE-EPOCH-001"
kind = "safety"
statement = "Evidence carrying a retired connection, membership, room transport-authority revision, attachment, media generation, playlist contents revision, selection generation, or load attempt, and a guarded playlist request whose expected server-issued canonical playlist epoch no longer matches, cannot mutate successor authority; a client cannot pair a newly observed transport revision with player state sampled before that revision's dependent command was applied, predecessor Play authority remains fenced until the selected successor is physically reset and accepts a post-selection playstate, and every changed canonical selection in a room with negotiated Sorotte lifecycle authority retires predecessor position and watcher samples before publishing successor transport state."

[[invariant]]
id = "LIFE-IDENT-001"
kind = "safety"
statement = "Identities from different domains are never compared as interchangeable counters."

[[invariant]]
id = "LIFE-DELIVERY-001"
kind = "safety"
statement = "A dependent player effect cannot precede terminal delivery of its exact causal protocol frame."

[[invariant]]
id = "LIFE-ONCE-001"
kind = "safety"
statement = "One accepted semantic transition, including concurrent equivalent intents, produces at most one canonical commit and at most one terminal client result."

[[invariant]]
id = "LIFE-EOF-001"
kind = "safety"
statement = "Only natural completion correlated to the current playlist contents revision, row, and selection generation can request canonical playlist progression or terminal authority; progression commits only while its expected row and server-issued canonical playlist epoch still match, a no-loop boundary commits one finite canonical pause at the media endpoint, and stale concurrent contenders are no-ops."

[[invariant]]
id = "LIFE-STATUS-001"
kind = "privacy"
statement = "Participant status remains advisory, privacy-safe, epoch-bound, and absent when correlation is insufficient."

[[invariant]]
id = "LIFE-SNAPSHOT-001"
kind = "safety"
statement = "An authoritative snapshot installs one internally coherent generation of room, playlist, playstate, readiness, and status facts."

[[invariant]]
id = "LIFE-EXIT-001"
kind = "liveness"
statement = "Every transient state has a bounded transition to progress, retry, explicit failure, or termination."

[[invariant]]
id = "LIFE-CONVERGE-001"
kind = "liveness"
statement = "After accepted canonical authority and bounded faults cease, every capable participant converges or exposes a specific inability."

[[invariant]]
id = "LIFE-REJOIN-001"
kind = "liveness"
statement = "Reconnect and late join obtain a current authoritative snapshot without depending on missed deltas."

[[invariant]]
id = "LIFE-RECOVERY-001"
kind = "liveness"
statement = "A recoverable player or transport failure cannot leave the lifecycle permanently terminal while a bounded successor is available."

[[invariant]]
id = "LIFE-SHUTDOWN-001"
kind = "liveness"
statement = "Every supported interactive or targetable platform shutdown signal enters the same bounded drain and releases every owned process, task, socket, temporary root, and evidence writer."

[[invariant]]
id = "LIFE-TRACE-001"
kind = "observability"
statement = "Every causal transition can be attributed without recording secret or raw media identity."

[[invariant]]
id = "LIFE-FAILURE-001"
kind = "observability"
statement = "A failed requirement preserves the first divergent boundary and does not become success because a retry later passes."

[[gap]]
id = "GAP-MODEL-001"
title = "Independent composition model"
status = "closed"
risk = "critical"
owners = ["verification", "player", "client-core", "gui", "server"]
summary = "The independent explorer executes every transition and source, evaluates every assigned invariant after each event, rejects adversarial histories, and deterministically shrinks and persists first divergences."
closure = "An independent state-aware generator executes every lifecycle transition, checks all assigned invariants after every step, shrinks failures, and persists minimized replay schedules."

[[gap]]
id = "GAP-TRACE-001"
title = "Cross-process causal evidence ledger"
status = "open"
risk = "critical"
owners = ["verification", "client-app", "gui", "server", "player"]
summary = "The external harness now emits a closed privacy-safe causal projection, but product roles do not yet emit the complete shared identity and causal-edge schema."
closure = "All product roles and the harness emit and validate the schema-versioned redacted causal ledger defined by the lifecycle contract."

[[gap]]
id = "GAP-SYSTEM-001"
title = "Actual-server multi-client real-player lifecycle harness"
status = "open"
risk = "critical"
owners = ["verification", "gui", "server", "player"]
summary = "The packaged actual-server, three-client, real-mpv harness now proves the CLI/server/player lifecycle through deterministic fragmentation, participant-status loss and aging, selected-entry replacement under a stable index, empty-playlist unload and restore, missed-start reconnect, natural-EOF successor fencing, bounded terminal pause, player failure recovery, and clean withdrawal; exact packaged GUI composition remains outside it."
closure = "A required harness runs the packaged actual server, at least two isolated packaged clients, and their real supported players while an external oracle verifies the complete causal path."

[[gap]]
id = "GAP-FAULT-001"
title = "Replayable cross-boundary schedule control"
status = "open"
risk = "high"
owners = ["verification", "client-app", "gui", "server", "player"]
summary = "The packaged harness now composes deterministic protocol fragmentation, bounded advisory-report loss and suppression, cut-and-hold, a missed start, production reconnect, and real-player catch-up, but the cross-boundary schedule is not yet externally replayable/shrinkable and lacks general frame delay, backpressure, half-close, reset, worker-stall, and additional IPC-fault variants."
closure = "A deterministic scheduler and protocol proxy record, replay, and shrink realistic delay, fragmentation, backpressure, half-close, reset, worker stall, and cross-channel ordering schedules."

[[gap]]
id = "GAP-PLAYLIST-001"
title = "Natural completion through canonical peer playlist progression"
status = "open"
risk = "critical"
owners = ["verification", "gui", "client-core", "server", "player"]
summary = "Client/server seams prove coherent empty selection retirement, physical unload, atomic paused-zero transport authority for every changed selection, guarded natural-EOF publication, one canonical commit across simultaneous contenders, stale ABA and replacement rejection, legacy fallback, peer loads, and an authorized finite terminal pause; the packaged real-mpv walk proves selected-entry replacement under a stable numeric index, empty/restore convergence, one ordinary video advance without completed-media leakage, and a no-loop final-video pause that cannot project beyond duration, while loop-enabled, cache-pause, and transport-failure terminal schedules remain open."
closure = "Real players complete generated media under ordinary, loop, last-item, cache-pause, and transport-failure schedules; only valid natural completion commits one canonical transition and all capable peers converge."

[[gap]]
id = "GAP-START-001"
title = "Late-join and delayed-participant start convergence"
status = "open"
risk = "critical"
owners = ["verification", "client-core", "gui", "server", "player"]
summary = "Actual-server seams cover a delayed required member and a late joiner during preparation; the packaged walk now covers a follower missing Play and catching up after production reconnect, but not participants joining or resuming at every start-gate phase."
closure = "Generated late-join, slow-resolution, partition, reconnect, and sleep-resume walks prove convergence or an explicit bounded inability for every start-gate phase."

[[gap]]
id = "GAP-STATUS-001"
title = "Packaged participant-status cadence and self-healing"
status = "open"
risk = "high"
owners = ["verification", "client-core", "client-app", "gui", "server"]
summary = "The packaged real-player harness proves cadence, one-loss self-healing, delayed and stale server classification under advisory-only suppression, fresh recovery without canonical mutation, late-join delivery, withdrawal, and reconnect recovery; second-client GUI projection remains open."
closure = "The multi-process harness proves heartbeat cadence, one-loss self-healing, delayed and stale classification, late-join snapshot delivery, withdrawal, privacy under controlled delay, and the exact packaged GUI projection in a second client."

[[gap]]
id = "GAP-RELEASE-001"
title = "Exact packaged lifecycle release gate"
status = "open"
risk = "critical"
owners = ["verification", "release"]
summary = "GUI and server publication now depend on a reusable exact-SHA release-mode server/CLI/real-mpv gate that stages only privacy-safe evidence and requires every declared gap closed; successful hosted evidence and exact packaged GUI consumption remain open."
closure = "The release workflow runs the closed lifecycle model and system suite against immutable candidate artifacts and publishes only the tested digests."

[[machine]]
id = "application"
title = "Application process"
mode = "finite"
initial_state = "not-started"
terminal_states = ["terminated"]

[[machine.state]]
id = "not-started"
title = "Not started"
kind = "stable"
description = "No application process owns playback resources."

[[machine.state]]
id = "starting"
title = "Starting"
kind = "transient"
description = "The application is acquiring configuration, workers, transport, and player ownership."

[[machine.state]]
id = "running"
title = "Running"
kind = "stable"
description = "The application event loop can own session and player lifecycle work."

[[machine.state]]
id = "stopping"
title = "Stopping"
kind = "transient"
description = "New lifecycle work is fenced while owned resources drain."

[[machine.state]]
id = "terminated"
title = "Terminated"
kind = "terminal"
description = "The process and every owned playback resource are released."

[[machine.transition]]
id = "APP-LAUNCH-001"
title = "Launch application"
from = ["not-started"]
to = "starting"
cause = "A user or harness launches the client application."
authority = "application-process"
risk = "high"
invariants = ["LIFE-IDENT-001", "LIFE-EXIT-001", "LIFE-TRACE-001"]
evidence = ["GUI-PLAYER-001", "PL-PROC-001"]
covered_tiers = ["model", "seam"]
required_tiers = ["model", "seam", "system"]
gaps = ["GAP-MODEL-001", "GAP-SYSTEM-001", "GAP-TRACE-001"]

[[machine.transition]]
id = "APP-RUN-001"
title = "Complete startup"
from = ["starting"]
to = "running"
cause = "Required startup ownership is established."
authority = "application-process"
risk = "critical"
invariants = ["LIFE-EPOCH-001", "LIFE-EXIT-001", "LIFE-TRACE-001"]
evidence = ["GUI-PLAYER-001", "PL-PROC-001"]
covered_tiers = ["model", "seam"]
required_tiers = ["model", "seam", "system"]
gaps = ["GAP-MODEL-001", "GAP-SYSTEM-001", "GAP-TRACE-001"]

[[machine.transition]]
id = "APP-STOP-001"
title = "Begin shutdown or startup rollback"
from = ["starting", "running"]
to = "stopping"
cause = "The user exits, a supported interactive or targetable platform console signal arrives, or startup cannot safely continue."
authority = "application-process"
risk = "critical"
invariants = ["LIFE-EPOCH-001", "LIFE-EXIT-001", "LIFE-SHUTDOWN-001", "LIFE-FAILURE-001"]
evidence = ["PL-PROC-001", "SYNC-LIFECYCLE-001"]
covered_tiers = ["model", "seam"]
required_tiers = ["model", "seam", "system"]
gaps = ["GAP-MODEL-001", "GAP-SYSTEM-001", "GAP-TRACE-001"]

[[machine.transition]]
id = "APP-TERM-001"
title = "Complete shutdown"
from = ["stopping"]
to = "terminated"
cause = "Every owned process, task, socket, root, and evidence writer is released."
authority = "application-process"
risk = "critical"
invariants = ["LIFE-SHUTDOWN-001", "LIFE-TRACE-001", "LIFE-FAILURE-001"]
evidence = ["PL-PROC-001", "SYNC-LIFECYCLE-001"]
covered_tiers = ["model", "seam"]
required_tiers = ["model", "seam", "system"]
gaps = ["GAP-MODEL-001", "GAP-SYSTEM-001", "GAP-TRACE-001", "GAP-RELEASE-001"]

[[machine]]
id = "player-attachment"
