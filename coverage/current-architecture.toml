[[crate]]
name = "sorotte-secret"
responsibility = "Typed sensitive values and redacted formatting."

[[crate]]
name = "sorotte-protocol"
responsibility = "Wire schemas, compatibility decoding, and encoded byte budgets."

[[crate]]
name = "sorotte-core"
responsibility = "Shared room and synchronization domain types."

[[crate]]
name = "sorotte-lifecycle-evidence"
responsibility = "Causal records, bounded serialization, and observable recorder failure."

[[crate]]
name = "sorotte-server"
responsibility = "Room authority, fanout, admission/byte permits, clocks, and durable server state."

[[crate]]
name = "sorotte-media-match"
responsibility = "Media identity/indexing and owned cancellable extraction processes."

[[crate]]
name = "sorotte-client-core"
responsibility = "Connection-scoped authority, ordered player observations, barriers, and local intent."

[[crate]]
name = "sorotte-client-app"
responsibility = "Shared application configuration, settings transactions, and presentation boundaries."

[[crate]]
name = "sorotte-player-api"
responsibility = "Player commands, physical observations, and lifecycle contracts."

[[crate]]
name = "sorotte-player-mpv"
responsibility = "mpv attachment, process containment, IPC recovery, and trusted Lua leases."

[[crate]]
name = "sorotte-plex"
responsibility = "Credentialed Plex discovery, bounded requests, and logical media resolution."

[[crate]]
name = "sorotte-cli"
responsibility = "CLI startup, session ownership, user commands, and bounded readers."

[[crate]]
name = "sorotte-gui"
responsibility = "GUI intent/projection, worker ownership, native accessibility, and update staging."

[[crate]]
name = "sorotte-sim"
responsibility = "Deterministic simulations and generated lifecycle histories."

[[crate]]
name = "sorotte-compat"
responsibility = "Pinned independent Python interoperability and honest prerequisite accounting."

