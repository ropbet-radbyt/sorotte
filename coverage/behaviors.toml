schema_version = 1

[policy]
allowed_namespaces = ["PL", "SYNC", "NET", "SRV", "CFG", "GUI", "COMPAT", "MEDIA", "SEC", "REL"]
allowed_risks = ["critical", "high", "medium", "low"]
critical_minimum_proofs = 2
required_jobs = [
    "checks",
    "lifecycle-contract",
    "gui-semantic",
    "rust-windows",
    "coverage-diff",
    "compat-live-tls",
    "media-match-generated-media",
    "mpv-pr-semantics",
]

[lanes.lifecycle-contract]
runner = "rust-exact"
required_on = ["push", "pull_request", "workflow_dispatch"]
operating_systems = ["linux"]
timeout_seconds = 900

[lanes.gui-semantic]
runner = "gui-semantic-suite"
required_on = ["push", "pull_request", "workflow_dispatch"]
operating_systems = ["linux"]
timeout_seconds = 900
complete_inventory = true

[lanes.gui-semantic.semantic_suite]
package = "sorotte-gui"
binary = "sorotte-gui-semantic-suite"
features = ["gui-semantic-smoke", "live-python-interop"]
scenarios = [
    "configuration-surface-flow",
    "core-shell-smoke-flow",
    "localized-runtime-flow",
    "runtime-chat-flow",
    "runtime-transport-churn-flow",
    "drag-and-drop-ingest-flow",
    "playlist-workflow-flow",
    "player-setup-flow",
    "persistence-reset-flow",
    "detached-runtime-ownership-flow",
    "live-python-peer-connect-flow",
    "live-python-peer-controlled-room-flow",
    "seek-preparation-flow",
    "readiness-v2-flow",
]

[[behavior]]
id = "PL-ACK-001"
title = "A delayed snapshot acknowledgement cannot retire a newer overflow gap"
risk = "critical"
owners = ["player", "client-core", "gui"]
invariants = [
    "an unacknowledged batch remains byte-for-byte stable",
    "acknowledging an older snapshot cannot erase a newer overflow gap",
]

[[behavior.proof]]
id = "PL-ACK-001.reducer"
kind = "rust-test"
oracle = "state-invariant"
package = "sorotte-player-mpv"
target_kind = "lib"
test = "lifecycle::tests::delayed_snapshot_ack_preserves_a_new_overflow_gap"
source = "crates/sorotte-player-mpv/src/lifecycle.rs"
feature_mode = "all-features"
operating_systems = ["linux"]
required_lanes = ["lifecycle-contract"]

