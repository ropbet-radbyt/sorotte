[workspace]
members = [
    "crates/sorotte-secret",
    "crates/sorotte-protocol",
    "crates/sorotte-core",
    "crates/sorotte-server",
    "crates/sorotte-media-match",
    "crates/sorotte-client-core",
    "crates/sorotte-client-app",
    "crates/sorotte-player-api",
    "crates/sorotte-player-mpv",
    "crates/sorotte-plex",
    "crates/sorotte-cli",
    "crates/sorotte-gui",
    "crates/sorotte-sim",
    "crates/sorotte-compat",
]
resolver = "2"

[workspace.package]
version = "0.2.3"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.97.1"

[workspace.dependencies]
anyhow = "1.0.104"
base64 = "0.22.1"
eframe = { version = "0.35.0", default-features = false, features = ["accesskit", "default_fonts", "glow", "inspection", "wayland", "web_screen_reader", "x11"] }
egui = "0.35.0"
getrandom = "0.4.3"
md-5 = "0.11.0"
mlua = { version = "0.12.0", features = ["lua54", "serde", "vendored"] }
regex = "1.13.1"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "query", "rustls-no-provider"] }
rfd = "0.17.2"
rustls = "0.23.42"
rustls-pemfile = "2.2.0"
rusqlite = { version = "0.40.1", features = ["bundled"] }
rustfft = "6.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
semver = "1.0.28"
sha1 = "0.11.0"
sha2 = "0.11.0"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-rustls = "0.26.4"
url = "2.5.8"
webpki-roots = "1.0.9"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Accessibility"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
