[workspace]
members = [
    "crates/sorotte-secret",
    "crates/sorotte-protocol",
    "crates/sorotte-core",
    "crates/sorotte-server",
    "crates/sorotte-media-match",
    "crates/sorotte-client-core",
    "crates/sorotte-client-app",
    "crates/sorotte-player-api",
    "crates/sorotte-player-mpv",
    "crates/sorotte-plex",
    "crates/sorotte-cli",
    "crates/sorotte-gui",
    "crates/sorotte-sim",
    "crates/sorotte-compat",
]
resolver = "2"

[workspace.package]
version = "0.2.2"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.96.0"

[workspace.dependencies]
anyhow = "1.0.98"
base64 = "0.22.1"
eframe = "0.33.3"
egui = "0.33.3"
getrandom = "0.2.15"
md-5 = "0.10.6"
regex = "1.11.1"
reqwest = { version = "0.12.23", default-features = false, features = ["blocking", "rustls-tls-webpki-roots-no-provider"] }
rfd = "0.15.4"
rustls = "0.23.34"
rustls-pemfile = "2.2.0"
rusqlite = { version = "0.32.1", features = ["bundled"] }
rustfft = "6.2.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
semver = "1.0.23"
sha1 = "0.10.6"
sha2 = "0.10.8"
thiserror = "2.0.12"
tokio = { version = "1.44.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-rustls = "0.26.2"
webpki-roots = "0.26.11"
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Accessibility"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
